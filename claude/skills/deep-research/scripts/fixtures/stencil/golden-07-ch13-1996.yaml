body: |
  <h2>The Vote</h2>
  <p>The June runoff went to Yeltsin, according to the <a href="https://www.rferl.org/example">official record</a>, with the wording "We won." carried in the campaign's own account.</p>
  <blockquote>"We won."</blockquote>
  <p>Turnout is given only in the source's own account, and the same <a href="https://www.rferl.org/example">RFE/RL report</a> declines to state it.</p>
  <h2>Loans For Shares</h2>
  <p>Loans-for-shares converts political access into ownership.</p>
