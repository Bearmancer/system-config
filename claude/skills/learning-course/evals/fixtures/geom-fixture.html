<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Geometry checker fixture</title>
	</head>
	<body>
		<svg viewBox="0 0 1200 600" width="100%">
			<rect
				x="40"
				y="40"
				width="300"
				height="200"
				fill="none"
				stroke="#c8c2b4"
				stroke-width="1.4"
			/>
			<rect
				x="60"
				y="60"
				width="150"
				height="50"
				rx="8"
				fill="#fff"
				stroke="#8a8578"
			/>
			<text x="66" y="88" font-size="12" fill="#201d1a">
				Framed member (legal)
			</text>
			<rect
				x="400"
				y="40"
				width="200"
				height="80"
				rx="8"
				fill="#fff"
				stroke="#8a8578"
			/>
			<text x="410" y="56" font-size="12" fill="#201d1a">Node A</text>
			<rect
				x="430"
				y="60"
				width="100"
				height="40"
				rx="8"
				fill="#fff"
				stroke="#8a8578"
			/>
			<text x="560" y="70" font-size="12" fill="#201d1a">
				Crossing label overlaps node A edge
			</text>
			<line
				x1="200"
				y1="520"
				x2="900"
				y2="520"
				stroke="#1a7f37"
				stroke-width="2.2"
			/>
			<text x="200" y="505" font-size="12" fill="#1a7f37">
				Clean edge and clean label
			</text>
		</svg>
	</body>
</html>
