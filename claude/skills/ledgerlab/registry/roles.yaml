# Model roles (ADR 0013). No checking role shares a family with the author.
# `id_status: unverified` = the id could not be checked against `opencode models` (the command printed nothing on the
# authoring host, 2026-10-02). Confirm on a host where it lists models, and test vision per model.
# system-config opencode/opencode.jsonc allows muse-spark-1.3-contributor, deepseek-v4.1-flash, qwen3.7-plus and
# mimo-v2.6-flash, and sets qwen3.8-flash to disabled. ADR 0013 names qwen-3.8-flash for the verifier: enable it in
# that config, or change the verifier here.
# `family` also maps a visual-read `read_by` value (model id or role name) to its model family (ADR 0012).
schema: 1
roles:
  author: {model: "opencode-go/muse-spark-1.3-contributor", family: muse, id_status: unverified, note: "free; writes lessons from verified claims"}
  extractor: {model: "opencode-go/mimo-v2.6-flash", family: mimo, id_status: unverified, note: "free; tool-less; splits source text and final prose into claims"}
  verifier: {model: "opencode-go/qwen3.8-flash", family: qwen, id_status: unverified, note: "disabled in opencode.jsonc; re-checks every claim, all statuses"}
  media: {model: "opencode-go/deepseek-v4.1-flash", family: deepseek, id_status: unverified, note: "audio/video ingest and first visual read"}
checking_roles: [extractor, verifier, media]
