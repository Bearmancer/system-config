<circle cx="43" cy="306" r="6" fill="#1d4e5f"/><text x="54" y="310" fill="#3d392f">circle teal = ranking or interview record (supported or attributed)</text>
<rect x="374" y="300" width="12" height="12" fill="#8c2f1b"/><text x="390" y="310" fill="#3d392f">square rust = NYT survey round [O1][O2]</text>
<circle cx="43" cy="328" r="6" fill="#b98a2f"/><text x="54" y="332" fill="#3d392f">circle ochre = single-voice interview frame (attributed, partial)</text>
<rect x="374" y="322" width="12" height="12" fill="#3d392f"/><text x="390" y="332" fill="#3d392f">square ink = freeze 2026-09-21</text>
