<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="tt ttd">
<title id="tt">Timeline: NYT rounds, rankings, interviews, freeze</title>
<desc id="ttd">Horizontal timeline from Siena 2022 through freeze 2026-09-21. Legend explains node shapes and line meaning.</desc>
<rect width="760" height="400" fill="#faf8f2"/>
<text x="24" y="34" font-family="Georgia,serif" font-size="20" fill="#1c1a16">Elapsed: survey rounds to freeze</text>
<line x1="40" y1="140" x2="720" y2="140" stroke="#1c1a16" stroke-width="2"/>
<g font-family="system-ui,sans-serif" font-size="11">
