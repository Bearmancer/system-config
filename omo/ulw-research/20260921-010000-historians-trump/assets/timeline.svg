<circle cx="230" cy="140" r="8" fill="#1d4e5f"/><text x="190" y="170" fill="#1c1a16">PGP 2024</text><text x="188" y="184" fill="#6b6459">10.92 last</text>
<rect x="342" y="132" width="16" height="16" fill="#8c2f1b"/><text x="310" y="170" fill="#1c1a16">NYT Apr30 2025</text><text x="322" y="184" fill="#6b6459">35 / 22 actions</text>
<rect x="452" y="132" width="16" height="16" fill="#8c2f1b"/><text x="418" y="170" fill="#1c1a16">NYT Dec22 2025</text><text x="432" y="184" fill="#6b6459">36 experts</text>
