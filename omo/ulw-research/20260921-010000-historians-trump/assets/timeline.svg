<circle cx="650" cy="140" r="8" fill="#b98a2f"/><text x="606" y="170" fill="#1c1a16">Meacham 2026-02-16</text><text x="618" y="184" fill="#6b6459">degree-kind</text>
<rect x="690" y="132" width="16" height="16" fill="#3d392f"/><text x="662" y="205" fill="#1c1a16">Freeze 2026-09-21</text>
<text x="40" y="238" fill="#1c1a16">Also on record: C-SPAN 2021 (41st, 312, n=142) precedes this axis;</text>
