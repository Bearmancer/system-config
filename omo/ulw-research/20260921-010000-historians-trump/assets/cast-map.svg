<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="ct ctd">
<title id="ct">Cast map: historians, survey leads, and frames</title>
<desc id="ctd">Node graph linking NYT rounds to rankings teams and interview voices. Legend explains node color, edge style, and verdict codes.</desc>
<rect width="760" height="460" fill="#faf8f2"/>
<text x="24" y="32" font-family="Georgia,serif" font-size="20" fill="#1c1a16">Cast map: who says what</text>
<g font-family="system-ui,sans-serif" font-size="11">
<rect x="24" y="60" width="170" height="52" rx="6" fill="#8c2f1b"/><text x="34" y="82" fill="#fff">NYT Apr30 2025</text><text x="34" y="98" fill="#f1ece0">35 historians [O1]</text>
<rect x="24" y="122" width="170" height="52" rx="6" fill="#8c2f1b"/><text x="34" y="144" fill="#fff">NYT Dec22 2025</text><text x="34" y="160" fill="#f1ece0">36 experts [O2]</text>
<rect x="280" y="60" width="180" height="52" rx="6" fill="#1d4e5f"/><text x="290" y="82" fill="#fff">C-SPAN 2021</text><text x="290" y="98" fill="#dff">41st 312 n=142 [O3]</text>
<rect x="280" y="122" width="180" height="52" rx="6" fill="#1d4e5f"/><text x="290" y="144" fill="#fff">PGP 2024</text><text x="290" y="160" fill="#dff">last 10.92 [O5]</text>
<rect x="280" y="184" width="180" height="52" rx="6" fill="#b98a2f"/><text x="290" y="206" fill="#fff">Siena 2022</text><text x="290" y="222" fill="#fff">category-last [O22]</text>
<rect x="540" y="60" width="196" height="52" rx="6" fill="#ffffff" stroke="#1d4e5f"/><text x="550" y="82" fill="#1c1a16">Meacham: degree-kind [O6]</text><text x="550" y="98" fill="#6b6459">denial qualified [C4]</text>
<rect x="540" y="122" width="196" height="52" rx="6" fill="#ffffff" stroke="#1d4e5f"/><text x="550" y="144" fill="#1c1a16">Brinkley: no-firewall [O17]</text><text x="550" y="160" fill="#6b6459">attributed [C8]</text>
<rect x="540" y="184" width="196" height="52" rx="6" fill="#ffffff" stroke="#1d4e5f"/><text x="550" y="206" fill="#1c1a16">Riley: steroids [O20]</text><text x="550" y="222" fill="#6b6459">attributed [C9]</text>
<rect x="540" y="246" width="196" height="52" rx="6" fill="#ffffff" stroke="#1d4e5f"/><text x="550" y="268" fill="#1c1a16">Perry: braggadocio [O21]</text><text x="550" y="284" fill="#6b6459">qualified 228v58 [C10]</text>
<line x1="194" y1="86" x2="280" y2="86" stroke="#1c1a16"/><line x1="194" y1="148" x2="280" y2="148" stroke="#1c1a16" stroke-dasharray="5 4"/>
<line x1="460" y1="86" x2="540" y2="86" stroke="#1c1a16" stroke-dasharray="5 4"/><line x1="460" y1="148" x2="540" y2="148" stroke="#1c1a16" stroke-dasharray="5 4"/>
<line x1="460" y1="210" x2="540" y2="210" stroke="#1c1a16" stroke-dasharray="5 4"/><line x1="194" y1="148" x2="280" y2="210" stroke="#1c1a16" stroke-dasharray="2 4"/>
</g>
<g font-family="system-ui,sans-serif" font-size="11">
<rect x="24" y="318" width="712" height="122" fill="#ffffff" stroke="#e2dccf"/>
<text x="36" y="340" font-weight="bold" fill="#1c1a16">Legend (complete)</text>
<rect x="36" y="348" width="14" height="10" fill="#8c2f1b"/><text x="54" y="357" fill="#3d392f">rust solid = NYT survey round (method anchor)</text>
<rect x="330" y="348" width="14" height="10" fill="#1d4e5f"/><text x="348" y="357" fill="#3d392f">teal solid = ranking series (supported / split)</text>
<rect x="36" y="366" width="14" height="10" fill="#ffffff" stroke="#1d4e5f"/><text x="54" y="375" fill="#3d392f">white + teal edge = interview voice (attributed)</text>
<text x="36" y="391" fill="#3d392f">solid edge = direct method link; dashed edge = attributed frame link (voice says, not fact-assert).</text>
<text x="36" y="407" fill="#3d392f">Codes: [C#] = claim id; [O#] = observation id; supported / partial / attributed / qualified per SYNTHESIS.</text>
<text x="36" y="423" fill="#6b6459">Full roster with roles: open the companion roster index.</text>
</g>
</svg>
