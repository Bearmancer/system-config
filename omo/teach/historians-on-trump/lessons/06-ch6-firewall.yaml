narrative: |
  <p>The report carries Brinkley Crossroads wording inside a single-voice frame with no second corroboration, per the <a href="https://www.roosevelthouse.hunter.cuny.edu/">Roosevelt House program page</a>, an attribution <strong>confirmed</strong> as voice-says rather than fact-held.</p>
  <blockquote>"There's no real firewall between Trump's" — Brinkley, Crossroads 2025-05-07</blockquote>
  <p>The video-only MTP appearance of 2026-01-20 stays title-description only, per the <a href="https://www.nbcnews.com/meet-the-press">NBC Meet the Press archive</a>, so any extended quote past the frozen snippet is <strong>unfindable</strong> in the transcript record and left <strong>unverified</strong>.</p>
  <blockquote>"It is a presidency on steroids" — Riley</blockquote>
  <p>Riley steroids wording travels the same road, per the <a href="https://millercenter.org/">Miller Center commentary</a>: an <strong>allegation</strong>-grade frame, supported-as-attribution, never taught as fact.</p>
machinery: |
  <p>Attribution-only teaching cites who said it, where, and with what qualifier, per the same <sup><a href="https://www.roosevelthouse.hunter.cuny.edu/">1</a></sup> page and the same <sup><a href="https://millercenter.org/">3</a></sup> commentary, then stops before fact language.</p>
  <p>Roosevelt House and archive pages supply context around the voices, per the same <sup><a href="https://www.roosevelthouse.hunter.cuny.edu/">1</a></sup> page; they never substitute for a missing transcript.</p>
