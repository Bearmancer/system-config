narrative: |
  <p>On Apr 30 2025 the report states thirty-five historians were asked about twenty-two actions, and that count is <strong>confirmed</strong> against the frozen verdict record described in <a href="https://www.nytimes.com/2025/04/30/us/politics/trump-historians-presidency.html">the April write-up</a>. The double witness holds: the report pointers and the cast table beside them agree on 35 historians and 22 actions, so the December 36 must never be swapped into this round, a misreading <strong>corrected</strong> at the start.</p>
  <blockquote>"whether 22 Trump actions had precedent"</blockquote>
  <p>That quoted line is the instrument speaking, not the historians rendering a verdict, and the distinction is <strong>confirmed</strong> as method-asked framing. Readers who recall one sweeping unprecedented label for the round carry a memory the record does not support; the teaching here separates the question posed from the answers sorted.</p>
  <blockquote>"no precedent as asked / modern-era precedent / different degree-kind / not uncommon"</blockquote>
  <p>The answers fell into those four buckets rather than one verdict, a split <strong>confirmed</strong> against the frozen record with the claim-graph lock holding it as partial and qualified. No bucket may be quoted alone as the round finding; the four-way shape is the finding.</p>
  <p>Three asked-about items, the Fed firing, the drug-boats action and the pardons, travel inside this round as framing only, and any fact claim built on them is <strong>barred</strong> by the annex rule. The full-page body beyond the frozen BrightData capture stays <strong>unverified</strong>, so this lesson teaches the asked-framing and the split, and stops with the frozen page in the same <sup><a href="https://www.nytimes.com/2025/04/30/us/politics/trump-historians-presidency.html">1</a></sup> write-up.</p>
machinery: |
  <p>Asked-framing means the instrument posed precedent as a question and historians sorted answers into four buckets. Vaughn and Rottinghaus assisted on method as rankings scholars, and the frozen BrightData full page stands in where the live page is JS-walled.</p>
  <p>Attribution travels separately from verdict standing throughout this course: the report says who was asked and how, while the record decides what stands, and the claim-graph lock with its SYNTHESIS pointer stays the verdict authority for every claim.</p>
