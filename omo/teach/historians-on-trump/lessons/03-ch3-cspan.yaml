narrative: |
  <p>The report places Trump 41st with 312 points from 142 raters on a 1 to 10 scale across ten equally weighted traits, and that placement is <strong>confirmed</strong> against <a href="https://www.c-span.org/presidentsurvey2021/">the frozen survey record</a> with double witness. Report pointers, subgraph text, manifest and synthesis agree on 41st and 312 alike; the vague 140 and the recalled 300 are <strong>corrected</strong> to 142 and 312, and the numerals below travel only in their canonical form.</p>
  <blockquote>"Each of the 10 categories is"</blockquote>
  <p>That quoted line opens the weights proof, and the proof lives on the methodology page, a separation <strong>confirmed</strong> against the manifest record. The habit of citing one page for both halves is <strong>corrected</strong> here: the methodology page answers weights while the overall page answers rank and score, so each half of the sentence cites its own page, method in <a href="https://www.c-span.org/presidentsurvey2021/page/methodology/">the methodology page</a> and score in the same <sup><a href="https://www.c-span.org/presidentsurvey2021/">1</a></sup> hub.</p>
  <blockquote>"41st 312"</blockquote>
  <p>The subgraph text beside the quoted pair keeps rank and score together as one citable unit, <strong>confirmed</strong> with the same double witness. Cross-series reading follows the convergence at the bottom, never the raw points; 312 is a within-series total only.</p>
  <p>The overall-last label belongs to the 2018 anchor story, where Trump displaces Buchanan as last, and recalling it as the C-SPAN 2021 result is <strong>corrected</strong> to 41st. Anything beyond the frozen pages stays <strong>unverified</strong> in this lesson, and the postponed 2025 edition with no data stays a gap, never a number.</p>
machinery: |
  <p>The instrument asks each rater to grade every president 1 to 10 on ten traits, then weights the traits equally and sums to the overall score. That design makes 312 a within-series total only; cross-series reading follows the convergence, never the raw points.</p>
  <p>Page discipline keeps the citation honest: weights cite methodology, rank and score cite the overall page, and the anchor story cites its own 2018 record. One page per half, every retelling.</p> One page per half, every retelling.</p>
