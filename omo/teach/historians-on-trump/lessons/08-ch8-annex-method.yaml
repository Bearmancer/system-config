  <p>The report holds three asked-about actions inside a framing-only rule <!-- unmapped tags [C4][O1]: no corresponding source in this lesson's YAML — flagged for review, not guessed -->, and that barred status is <strong>confirmed</strong> against the annex verdict beside the quoted rule.</p>
