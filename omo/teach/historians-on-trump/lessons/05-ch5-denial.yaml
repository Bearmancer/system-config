narrative: |
  <p>The report holds that no refusal-to-concede precedent exists while protest precedents differ, per the <a href="https://www.npr.org/programs/fresh-air/">NPR Fresh Air archive</a>, a denial reading <strong>confirmed</strong> against the Jackson archives record, the Nixon concession telegram, and the Gore SCOTUS-accept record.</p>
  <blockquote>"distrusting and delegitimizing elections, simply because" — Meacham</blockquote>
  <p>The absolute-first version of the claim is <strong>corrected</strong> to degree-kind: the same type of distrust at a sharply different scale, per the <a href="https://www.pbs.org/wnet/firingline/">PBS Firing Line archive</a>, with the qualifier travelling beside every citation.</p>
  <p>Fresh Air 2026-02-16 carries the claim, per the same <sup><a href="https://www.npr.org/programs/fresh-air/">1</a></sup> archive, and the later PBS exchange of 2026-05-26 carries the qualifier, per the same <sup><a href="https://www.pbs.org/wnet/firingline/">2</a></sup> archive, a pairing <strong>confirmed</strong> against the verdict record; Goodwin hope-character material corroborates the culture-grip point only <!-- no corresponding source in this lesson's YAML — flagged for review, not guessed -->, and anything beyond those frozen voices stays <strong>unverified</strong> here.</p>
machinery: |
  <p>Degree-kind sorting keeps protest inside precedent and refusal outside it: archives, telegram and court-acceptance records show contest without refusal, per the same <sup><a href="https://www.npr.org/programs/fresh-air/">1</a></sup> archive.</p>
  <p>Voice weight travels separately from verdict weight: a named historian says it, the record decides whether it stands, and the qualifier decides how far it reaches, per the same <sup><a href="https://www.pbs.org/wnet/firingline/">2</a></sup> archive; Goodwin corroboration <!-- no corresponding source --> never upgrades to denial proof.</p>
