narrative: |
  <p>The report gives Trump last at 10.92 beside Biden at 62.66 and Lincoln at 95.03, from 154 usable replies of 525 invited, and those figures are <strong>confirmed</strong> against the frozen white-paper record. The double witness holds: report pointers, glossary entry, manifest and synthesis agree on all three numerals, while the Qualtrics window of late 2023 into December with 525 invited and 154 usable is <strong>confirmed</strong> the same way.</p>
  <blockquote>"Trump last 10.92; Biden 62.66; Lincoln 95.03"</blockquote>
  <p>The quoted triple is the citable unit, and the stale Lincoln 93.87 from snippet drift is <strong>corrected</strong> to 95.03. The 93.87 figure appears only in snippet output, never in the frozen primary, so any retelling that carries it repeats drift, not record; the project homepage is never the numbers citation either, a habit <strong>corrected</strong> toward the white-paper PDF described at <a href="https://presidentialgreatnessproject.com/">the project home</a> only as signpost.</p>
  <blockquote>"category-last on integrity; overall third-worst"</blockquote>
  <p>Siena 2022 reads that split: last in the integrity category with third-worst overall, a reading <strong>confirmed</strong> against the frozen Siena PDF. The shortened overall-last version is best called <strong>partially correct</strong>, right about the category and <strong>wrong</strong> about the overall, while the plain overall-last label stays <strong>wrong</strong>; the 2018 anchor where Trump displaces Buchanan as last belongs to its own story, <strong>confirmed</strong> apart. Siena site copy stays summary, and grades cite the Siena PDF per <a href="https://sri.siena.edu/american-presidents/">the Siena page</a> note.</p>
  <p>Figure variants outside the frozen white-paper PDF stay <strong>unverified</strong>, and the peer-review layer behind the PGP numbers travels beside every citation without replacing the PDF. Two instruments, two primaries, one rule: cite the paper, never the homepage.</p>
machinery: |
  <p>PGP ran a Qualtrics greatness scale from zero to one hundred across late 2023 into December, while Siena asked scholars to grade twenty categories and aggregate separately. Different scales produce different kinds of last: PGP overall-last against the full field, Siena category-last with third-worst overall.</p>
  <p>The white-paper PDF carries the PGP numbers and the Siena PDF carries the category grades; homepages and site copy stay signposts, never primaries. Counts travel with their provenance line: who counted, from what source, and which primary still holds the figure.</p>
