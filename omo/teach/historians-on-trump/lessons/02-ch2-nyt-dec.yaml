narrative: |
  <p>On Dec 22 2025 the report states thirty-six experts were asked about second-round actions, and that count is <strong>confirmed</strong> by the cast table and the observation manifest alike. The April 35 must never be carried into December, a swap <strong>corrected</strong> at the start; the two numerals are double-witnessed apart, 35 with the April pointers and 36 with the December pointers, so each round keeps its own headcount.</p>
  <blockquote>"whether 22 Trump actions had precedent"</blockquote>
  <p>The December instrument re-ran the April asked-framing on new actions, and that method continuity is <strong>confirmed</strong> against the frozen verdict record. The December answers kept the April shape, split across the four buckets rather than collapsing into one unprecedented verdict, and any memory of a single second-term verdict is <strong>corrected</strong> back to the four-way split.</p>
  <blockquote>"felon-nominee"</blockquote>
  <p>The Sinha wording belongs to the December round as a named voice, an attribution <strong>confirmed</strong> against the frozen BrightData full page. The voice grade matters: a historian said it, while the record decides whether it stands, so this lesson teaches the wording as who said it and where, never as a fact held by the field.</p>
  <p>Quote discipline governs the rest: Sinha boats-quote wording beyond the frozen full pages stays <strong>unverified</strong>, and snippet-recall versions are left out entirely. The December lesson therefore runs on the same rule as April, asked-framing plus split, with voices <strong>attributed</strong> beside their round, in <a href="https://www.nytimes.com/2025/12/22/us/politics/trump-historians-second-term.html">the December write-up</a>.</p>
machinery: |
  <p>The second round re-ran the asked-framing instrument on new actions, with fresh voices sorted into the same four buckets. Voice attribution travels separately from verdict standing: a named historian said it, while the record decides whether it stands.</p>
  <p>Frozen primaries carry both rounds because the live pages are JS-walled: the BrightData full page stands where the browser cannot read, and anything past those frozen captures stays out of teaching until a citable slice exists.</p>
