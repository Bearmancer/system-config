narrative: |
  <p>Children find a projector in a landfill, slides go in, and an Altered World Event erases the adults. The case name itself is <strong>confirmed</strong> on <a href="https://control.fandom.com/wiki/Ordinary_AWE">the Ordinary AWE page</a>, and the Bureau's arrival, seizing Dylan and the projector while Jesse runs, is <strong>confirmed</strong> in the plot record.</p>
  <p>Jesse's counter-move is the fire:</p>
  <blockquote>"She burned the slides."</blockquote>
  <p>That she destroyed slides is <strong>confirmed</strong>. How many existed, how many burned, and how many survived is where the accounts split: the video's tally and <a href="https://control.fandom.com/wiki/Slide_Projector">the projector page's</a> tally do not match, so this lesson repeats the split and leaves it <strong>unverified</strong> rather than crowning a winner.</p>
  <p>One point survives the dispute intact and is <strong>confirmed</strong>: at least one burned slide reached Trench's hands, and that slide became the Hiss road in.</p>
machinery: |
  <p>Slides are addresses. Each one points the projector at a dimension, and Slidescape-36 is the address everything later depends on.</p>
  <p>Burning a slide closes its address, which is why the surviving burned slide matters more than the destroyed ones.</p>
