narrative: |
  <p>Jesse arrives pulled by Polaris, finds Trench dead of a gunshot, and lifts the Service Weapon. The Astral ritual that follows is <strong>confirmed</strong> against <a href="https://control.fandom.com/wiki/Control">the wiki plot record</a>: the Board selects her as Director on the spot, and she steps out into a House already wearing the Hiss.</p>
  <p>The Hiss announces itself with one endlessly repeated sentence:</p>
  <blockquote>"You are a worm through time."</blockquote>
  <p>The chant is <strong>confirmed</strong> as the Hiss incantation that Trench himself repeats on the Hotline tapes.</p>
  <p>Dylan, found voluntarily contained, warns Jesse against the voice inside her own head:</p>
  <blockquote>"Do not trust Polaris."</blockquote>
  <p>The warning itself is <strong>confirmed</strong> in the wiki plot record, while the exact wording here stays <strong>unverified</strong> outside the video's captions.</p>
  <p>The first impression that Trench simply took his own life is <strong>corrected</strong> by the tapes. The Hiss reached him during Darling's expeditions, and he opened the door himself with a kept burned slide. Jesse's counterstroke, shutting the projector and pulling Dylan back from the Hiss at the cost of his waking mind, is <strong>confirmed</strong> in <a href="https://www.ign.com/articles/2019/09/19/controls-ending-explained-in-depth-answers-for-all-your-questions">the ending breakdown</a>, which also notes the lockdown holds until the remaining Hiss dies.</p>
machinery: |
  <p>Three objects carry the plot. The Service Weapon binds and appoints. The Hotline carries Trench's lingering orders. The Slide Projector moves the invasion from backstory to present tense.</p>
  <p>Ahti's cassette player earns its own mission later; it is the only key to the maze guarding the projector's chamber.</p>
