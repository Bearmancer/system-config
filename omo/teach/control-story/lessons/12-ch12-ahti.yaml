narrative: |
  <p>Ahti hires Jesse before the Board finishes choosing her:</p>
  <blockquote>"You will be my assistant."</blockquote>
  <p>The title is <strong>confirmed</strong> as his standing term for Jesse, while the exact line as quoted here stays <strong>unverified</strong> outside the video's captions.</p>
  <p>His maze privileges are the hard fact. The Ashtray belongs to Trench's binding, yet Ahti crosses it at will and lends Jesse the passage via his cassette player. That freedom is <strong>confirmed</strong> in the maze record, which also notes the maze shields its privileged walkers from the Hiss mid-crossing.</p>
  <p>Then the holiday. Ahti departs on unexplained leave, immune and unbothered to the last, and the Finnish Tango mission that fetches him back only deepens the joke. Theories call him god, entity, or the House itself, and every one of them is <strong>unverified</strong>. The canon cited on <a href="https://control.fandom.com/wiki/Ashtray_Maze">the maze page</a> and <a href="https://www.eurogamer.net/control-walkthrough-guide-tips-6043?page=17">the maze guide</a> describes what he does, never what he is.</p>
machinery: |
  <p>Ahti works as a key dispenser with personality. Repairs unlock sectors, music unlocks the maze, and absence unlocks questions.</p>
  <p>His cassette player is the only object in the game that overrules a Director's binding, which is the strongest hint about him on record.</p>
