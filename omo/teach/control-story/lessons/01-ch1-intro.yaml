narrative: |
  <p>The video introduces itself as an installment of a series that unpacks stories from games, and names its subject in one breath:</p>
  <blockquote>"a Top Secret Agency dedicated to containing and studying paranatural phenomena"</blockquote>
  <p>That framing is <strong>confirmed</strong> against <a href="https://www.remedygames.com/games/control">Remedy's own Control page</a>, which describes a secretive agency invaded by an otherworldly threat, with the player becoming the new Director struggling to regain Control.</p>
  <p>The release facts around the subject are <strong>confirmed</strong> against <a href="https://en.wikipedia.org/wiki/Control_(video_game)">the overview record</a>: a 2019 third-person action-adventure from Remedy, built around Jesse Faden and the Hiss invasion of the Oldest House.</p>
  <p>The host admits even he had to rewatch his own footage to re-understand some story elements. That admission needs no verdict; it sets the contract for the next twelve chapters. Plot first, then the unpacking.</p>
machinery: |
  <p>Each lesson follows the video's own order. The plot walk comes before the lore, so later chapters can assume the full story is known.</p>
  <p>Verdicts sit beside quoted wording inside the narrative, and every chapter ends with its own Sources block.</p>
