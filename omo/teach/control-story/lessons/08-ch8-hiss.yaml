narrative: |
  <p>The invasion looks external until the tapes play. The first impression of an outside attack is <strong>corrected</strong> by <a href="https://control.fandom.com/wiki/Hiss_invasion">the invasion record</a>: Trench, already under influence, worked the projector himself, so the door opened from inside.</p>
  <p>What came through announces itself endlessly:</p>
  <blockquote>"You are a worm through time."</blockquote>
  <p>The sentence is <strong>confirmed</strong> as the Hiss incantation, repeated by the possessed and by Trench on the Hotline alike.</p>
  <p>The counter-frequency has a name and a shape. Darling's expeditions into the surviving slide dimension found a polyhedron organism he dubbed Hedron, the source of HRA resonance. That find is <strong>confirmed</strong> in the plot record, and so is the price: when the Hiss destroys Hedron, Jesse's mind nearly follows, until she rediscovers Polaris within herself. Dylan's boast that the Hiss set him free stays <strong>unverified</strong> as anything but his own allegiance, and <a href="https://control.fandom.com/wiki/The_Hiss">the Hiss page</a> keeps the entity's own origins blank.</p>
machinery: |
  <p>Hiss mechanics are resonance mechanics. Exposure converts, HRAs jam the signal, and Hedron out-sang the invasion until it died.</p>
  <p>Polaris inside Jesse is the last transmitter standing, which is why the ending can turn on an inner voice rather than a bigger gun.</p>
