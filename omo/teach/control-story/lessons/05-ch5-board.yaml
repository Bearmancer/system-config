narrative: |
  <p>The video states the setup plainly, in its own words:</p>
  <blockquote>"A group of paranatural entities, pretty much invisible, living in the Astral Plane."</blockquote>
  <p>The pyramid link is <strong>confirmed</strong> in the canon summaries: a massive upside-down black pyramid carries their speech, and Jesse grasps the gist where others hear noise.</p>
  <p>Then comes Darling's cut-down, again in the video's words:</p>
  <blockquote>"The Board only control the pyramid rather than the entirety of the Astral Plane."</blockquote>
  <p>That limit is <strong>confirmed</strong> as Darling's in-game hypothesis on <a href="https://control.fandom.com/wiki/The_Board">the Board page</a>. The assumption that the Board owns the Plane is <strong>corrected</strong> by it: they may be tenants with a loud artifact rather than landlords.</p>
  <p>The Former's exile fills out the warning. It was cast out, it says it was blamed for something, and the Board's anger when Jesse takes its gift is real. The backstory details stay <strong>unverified</strong>, and Board origins are never established anywhere in the canon cited here. The <a href="https://control.fandom.com/wiki/Astral_Plane">Astral Plane page</a> documents the place without naming its makers.</p>
machinery: |
  <p>The Board governs through appointment and ritual. Service Weapon bindings, Directorial Overrides, and pyramid audiences are all Board-mediated acts.</p>
  <p>The Former matters as proof the Board can lose members, which makes Jesse's later defiance thinkable.</p>
