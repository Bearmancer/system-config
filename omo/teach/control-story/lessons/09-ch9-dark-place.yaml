narrative: |
  <p>The sector was sealed after its AWE work went wrong, and Jesse pries it open following visions of Wake. That setup is <strong>confirmed</strong> in <a href="https://www.gamespot.com/reviews/control-awe-dlc-review-haunted-oldest-house/1900-6417549">the AWE review</a>, which names Hartman, consumed by darkness and worsened by Hiss interference, as the horror at its center.</p>
  <p>Wake's own warning about his double survives in the coverage:</p>
  <blockquote>"He's out there."</blockquote>
  <p>The line is <strong>confirmed</strong> in <a href="https://www.gamespot.com/articles/what-controls-awe-dlc-tells-us-about-alan-wakes-story/1100-6481849">the AWE story piece</a>, which also confirms the sting: Langston flags the event date as years in the future, grooming Jesse for a Bright Falls trip that has not happened yet.</p>
  <p>The crossover standing is <strong>confirmed</strong> at the top: the AWE expansion is the first formal event of the shared universe, per the studio's own statement. Whether Wake authored any of Jesse's story stays <strong>unverified</strong>, and the coverage treats it as tease rather than fact.</p>
machinery: |
  <p>Light is the combat verb here. Hartman cannot be hurt in darkness, so lamps and flares become weapons and the sector reads as horror rather than shooter.</p>
  <p>The Investigations Sector itself is an archive machine: every AWE case Jesse replays is a file the Bureau closed too early.</p>
