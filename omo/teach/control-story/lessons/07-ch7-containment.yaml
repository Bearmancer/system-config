narrative: |
  <p>The sector's purpose is <strong>confirmed</strong> on <a href="https://control.fandom.com/wiki/Containment_Sector">the Containment Sector page</a>: the Panopticon stores Altered Items and Objects of Power, including the Arctic Queen refrigerator and the Benicoff TV, behind cells built for things that cannot be killed.</p>
  <p>Dylan's place in that system is a cell of his own:</p>
  <blockquote>"Relocated to a containment cell in the Panopticon, considered a lost cause."</blockquote>
  <p>The P6 cell and the lost-cause judgment are <strong>confirmed</strong> on <a href="https://control.fandom.com/wiki/Dylan_Faden">Dylan's page</a>, which records the agent killings that put him there after Darling's protection ran out.</p>
  <p>Dylan's own account of his loyalties is blunter:</p>
  <blockquote>"I welcomed the Hiss. I let it in. The Hiss set me free."</blockquote>
  <p>The embrace is <strong>confirmed</strong> as his stated position, while his claim that Polaris uses Jesse stays <strong>unverified</strong>: it reads as anger at abandonment rather than evidence.</p>
machinery: |
  <p>Containment runs on two tools. Cells hold objects, and HRAs hold minds, since the Hiss takes people rather than things.</p>
  <p>Darling's amplifiers only work while Hedron sings, which ties this sector's safety to a god in another chapter.</p>
