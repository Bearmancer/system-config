narrative: |
  <p>The climax runs through the Astral Plane: Dylan tries to hand the Board's seat to the Hiss, Jesse pulls him back, and the projector goes dark. That sequence is <strong>confirmed</strong> in <a href="https://www.ign.com/articles/2019/09/19/controls-ending-explained-in-depth-answers-for-all-your-questions">the ending breakdown</a>, which also confirms the price and the aftermath: Dylan comatose, Jesse seated, and the lockdown still in force.</p>
  <p>The false defeat first: Jesse falls, the credits roll early, and she wakes a bureaucrat in a Hiss dream. The despair is <strong>corrected</strong> by the Oceanview return, where Polaris turns out to have ridden inside her all along. The dream-office beat is <strong>confirmed</strong> in the same breakdown.</p>
  <p>The last word belongs to the music:</p>
  <blockquote>"Take Control."</blockquote>
  <p>The Old Gods of Asgard track that carries the maze run shares its name with the final mission, both <strong>confirmed</strong> in the mission list and the collectible files. Whether Dylan ever wakes stays <strong>unverified</strong> in the base game, and the expansions pick up the chair, not the coma.</p>
machinery: |
  <p>The ending machine is a fake-out with a receipt. The false credits spend Jesse's defeat, then the motel scene refunds it with interest.</p>
  <p>What remains is maintenance: a Director, a lockdown, and a House still humming with the unconverted.</p>
