narrative: |
  <p>Darling never appears alive; he presents. His tapes guide Jesse through Dimensional Research to the chamber, and the find they describe is:</p>
  <blockquote>"A polyhedron-shaped organism he coined the Hedron."</blockquote>
  <p>The naming is <strong>confirmed</strong> in <a href="https://control.fandom.com/wiki/Control">the wiki plot record</a>: several expeditions into the one surviving slide dimension, a living source of HRA resonance, and a name Darling invented on the spot.</p>
  <p>The assumption that these presentations are live briefings is <strong>corrected</strong> by their placement. They are recordings Jesse finds after Darling is already gone, which is why every tape feels one step behind the disaster.</p>
  <p>His end is the gap this lesson refuses to fill. Whether he died, transformed, or walked somewhere unmappable is <strong>unverified</strong> across <a href="https://control.fandom.com/wiki/Casper_Darling">his page</a> and every file cited here. No tape says where he went, and this pass invents nothing.</p>
machinery: |
  <p>Darling's machine is the presentation itself: cheerful videos that convert apocalypse into procedure, one threshold at a time.</p>
  <p>The HRAs are his legacy hardware. Every agent Jesse meets alive wears his work.</p>
