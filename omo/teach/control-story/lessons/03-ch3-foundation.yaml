narrative: |
  <p>Jesse enters through the Restricted Area and asks the obvious question:</p>
  <blockquote>"Is this still a part of the Oldest House? It feels much older."</blockquote>
  <p>The line is <strong>confirmed</strong> on <a href="https://control.fandom.com/wiki/Foundation_(location)">the Foundation location page</a>, which places the caves beneath the Maintenance Sector and notes the red sand assayed as nothing stranger than iron oxide.</p>
  <p>The leak itself is <strong>confirmed</strong> there too. Marshall damaged the Nail during the Hiss invasion, the Plane bled through permanently, and Jesse's repair stops the spread without undoing what already crossed over.</p>
  <p>The Former's history arrives as a grudge:</p>
  <blockquote>"Blamed for something by the Board."</blockquote>
  <p>The exile story is <strong>confirmed</strong> in outline, while this exact wording stays <strong>unverified</strong> outside the video's captions. The base-game picture of a united command is <strong>corrected</strong> here: Director and Board openly disagree over the Nail, and <a href="https://www.ign.com/articles/control-the-foundation-dlc-review">the Foundation review</a> notes Jesse and the Board end the DLC at odds.</p>
  <p>What became of Marshall in the caves stays <strong>unverified</strong> in this pass; the video moves on without settling it, and so does this lesson.</p>
machinery: |
  <p>The Nail works as a lid. Everything Jesse does below is lid maintenance: four keys, one monolith, and two new crystal abilities granted along the way.</p>
  <p>The Former's gift matters because it is the first power Jesse holds that the Board did not approve.</p>
