narrative: |
  <p>The Bureau's own files date the Oldest House discovery to the nineteen-sixties, and the agency grew up around the building rather than the other way round. That founding order is <strong>confirmed</strong> on <a href="https://control.fandom.com/wiki/Federal_Bureau_of_Control">the Bureau page</a>, while exact dates stay <strong>unverified</strong> in this pass.</p>
  <p>Northmoor is the cautionary tale the Bureau keeps locked up: a Director whose paranatural strength outgrew the chair until containment became the only option. The containment itself is <strong>confirmed</strong> in the canon summaries, and Dylan's later comparison to Northmoor shows the Bureau still measures candidates against him.</p>
  <p>Trench's end replays the pattern from inside:</p>
  <blockquote>"You are a worm through time."</blockquote>
  <p>The chant is <strong>confirmed</strong> as the Hiss voice Trench carries onto the Hotline tapes, which is why his gunshot opens the game but does not end his influence. The Bureau history chapter of <a href="https://en.wikipedia.org/wiki/Control_(video_game)">the overview record</a> follows the same chain from discovery through Jesse's appointment.</p>
machinery: |
  <p>Director succession is the Bureau's core machine. The Board appoints, the Service Weapon binds, and the Prime Candidate Program keeps spares.</p>
  <p>Every spare the program raised is someone Jesse later has to answer for, which is why the program gets a chapter of its own.</p>
