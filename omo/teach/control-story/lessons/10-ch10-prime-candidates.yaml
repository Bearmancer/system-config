narrative: |
  <p>The numbering is the one hard fact in a soft file:</p>
  <blockquote>"Dylan and Jesse were dubbed P6 and P7."</blockquote>
  <p>The designations are <strong>confirmed</strong> in <a href="https://www.ign.com/articles/2019/09/19/controls-ending-explained-in-depth-answers-for-all-your-questions">the ending breakdown</a>, which adds the study design: Jesse lived free under watch while Dylan grew up in custody.</p>
  <p>Dylan's file reads as promise curdling. Darling judged him a parautilitarian comparable to Northmoor, then watched him kill Roberts, then more agents, until isolation and the Panopticon cell. That chain is <strong>confirmed</strong> on <a href="https://control.fandom.com/wiki/Dylan_Faden">Dylan's page</a>.</p>
  <p>The comforting idea that Jesse escaped by luck is <strong>corrected</strong> by the same coverage: the Bureau knew both siblings could hold the chair and kept Jesse as its unhandled spare. What the earlier candidates suffered stays <strong>unverified</strong> in this pass, and the program's founding charter is left for the Bureau historians.</p>
machinery: |
  <p>The program is a pipeline. Identify the gifted, raise them inside, bind the survivors to power, and file the rest.</p>
  <p>Jesse breaks the pipeline by arriving unbureaucratized: no raising, no filing, only the binding.</p>
