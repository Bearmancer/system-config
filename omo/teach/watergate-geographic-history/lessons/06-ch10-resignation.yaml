title: "Resignation"
chapter: 10
chapters_total: 12
time_range: "1:55:01–2:01:19"
transcript: "resignation-1h55m01s-2h01m19s.md"
lead: "The endgame compresses into seven weeks. Congress sets the impeachment clock, the Court orders the tapes surrendered, the smoking-gun tape destroys the last Hill support, and Nixon resigns. The chapter walks the final geography: restaurant, courtroom, East Room, South Lawn, Andrews, San Clemente."
