narrative: |
  <p>The chapter opens in a Capitol restaurant. Late in June 1974 Majority Leader Tip O'Neill dines with fellow politicians and reports that he has pressed Judiciary Chairman Peter Rodino on when articles of impeachment against Nixon will move. The Senate select committee's multi-volume final report has just landed, and the multi-volume scale is <strong>confirmed in substance</strong> against the filed record. If Judiciary recommends impeachment, the full House will almost surely follow. Nixon keeps some Hill supporters, but the base is soft. The next day Rodino gives O'Neill a timeline. The endgame is on.</p>
  <p>The scene shifts to the Supreme Court building, Nixon's final court of appeal. Oral argument in United States v. Nixon opens in early July. Chief Justice Warren Burger, Nixon's own appointee, reads the decision near the end of the month: the special prosecutor wins on all counts, eight to zero with one justice not participating, and Nixon must turn over the tapes, a result <strong>confirmed</strong> against the <a href="https://www.law.cornell.edu/supremecourt/text/418/683">Court opinion</a>. Nixon is at San Clemente when the ruling lands. He tells counsel Fred Buzhardt there may be a problem with the June 23 tape and orders him onto it.</p>
  <p>The resignation timing is tangled but, the video argues, inconsequential. By his memoirs Nixon decides early on the morning of July 31, just after the family returns from San Clemente, then vacillates for days. After a family meeting he tells chief of staff Alexander Haig to let them impeach him and fight to the end. Then the June 23 transcripts go public and congressional reaction is ferocious: Nixon released the three transcripts days before resigning while conceding they were at variance with prior statements, wording <strong>confirmed</strong> against the <a href="https://www.presidency.ucsb.edu/documents/statement-announcing-availability-additional-transcripts-presidential-tape-recordings">August 5 statement</a>. Whatever support remains evaporates overnight. Around August 6 Nixon decides a second time, and this decision holds. He confers with Vice President Ford, tells the family again, and starts drafting the resignation speech. The handover is set for Friday, August 9. The Judiciary Committee's own final impeachment report ran to 528 pages, a length <strong>confirmed</strong> against the <a href="https://www.nytimes.com/1974/08/23/archives/rodino-unit-issues-report-describing-case-against-nixon-rodino.html">contemporaneous report account</a>.</p>
  <p>The video pauses to warn against sensational late-days lore. Woodward and Bernstein, whose first book appeared that June, followed with The Final Days, packed with vivid claims about Nixon's last week, a publishing record <strong>confirmed in substance</strong> against the <a href="https://www.simonandschuster.com/books/The-Final-Days/Bob-Woodward/9780743274067">publisher file</a> for the 1976 volume. Some migrated into a 1995 film about Nixon. Stories of Nixon wandering the White House addressing paintings, or blubbering incoherently with Kissinger in prayer in the Lincoln bedroom, strike the presenter as fishy, and that skepticism is carried as the presenter's judgment, with the prayer-scene tale otherwise <strong>unverified</strong> against located record.</p>
  <p>On August 9 Nixon gives his farewell to staff in the East Room. The video calls it a press conference; the record shows morning remarks to cabinet and staff, rambling and elegiac by turns, a format <strong>corrected</strong> against the <a href="https://millercenter.org/the-presidency/presidential-speeches/august-9-1974-remarks-departure-white-house">departure-remarks file</a>. He recalls his parents and his Whittier, California upbringing, then offers the line the chapter treats as a flash of final clarity:</p>
  <blockquote><p>"Always remember, others may hate you, but those who hate you don't win unless you hate them, and then you destroy yourself."</p><cite>— Nixon, farewell remarks to White House staff, East Room</cite></blockquote>
  <p>The wording is <strong>confirmed</strong> against the <a href="https://www.presidency.ucsb.edu/documents/remarks-departure-from-the-white-house">farewell text</a>. Had he heeded that counsel in 1971 and 1972, the video reflects, the tragic end might never have come.</p>
  <p>The closing geography moves fast. The South Lawn, seen before in the opening chapter. A warm muggy August day. Nixon boards the helicopter for the last time, turns, and flashes the famous double victory signs. The helicopter lifts for Andrews Air Force Base, where the presidential jet waits. While the jet crosses the country toward San Clemente, Gerald Ford is sworn in as 38th president, and the jet's call sign changes mid-air from Air Force One to SAM 27000, since the president is no longer aboard, an account <strong>confirmed in substance</strong> against the <a href="https://www.snopes.com/fact-check/air-force-one-nixon-call-signs/">call-sign account</a> with its pilot attribution. The story ends at La Casa Pacifica, the San Clemente estate. Nixon's memoirs stop at Andrews, but the video lingers on the unrecorded moment: the Nixons walking into that house that afternoon, the presidency hours behind them, reaching, the presenter guesses, for a drink, a scene that stays <strong>unverified</strong> beyond the video's telling. Then a last tease: a minimum-security federal prison camp in Montgomery, Alabama, where two prominent scandal participants will serve time, a pointer whose details stay <strong>unverified</strong> here and belong to the aftermath chapter. The hatred line outlives the speech, though its afterlife beyond the farewell stays <strong>unverified</strong> in this telling.</p>
machinery: |
  <p>The mechanism is converging closure. No single blow ends it. The impeachment clock, the unanimous Court, and the smoking-gun tape each shut one exit: the House will act, the law will not shield the evidence, and the evidence destroys the political base. Once all three exits close within days of each other, resignation becomes the only corridor left, and the handoff machinery — helicopter, jet, oath, call sign — executes on schedule.</p>
  <p>Map key: blue marks law and succession, green pressure and counsel, red evidence; scope is chapter-10 on-stage ties only.</p>
