essentials:
  - "The Chennault affair. Nixon's campaign urges Saigon to stall the Paris talks. This is the original secret Nixon spends his presidency protecting."
  - "The Pentagon Papers arc. A classified study gets copied, leaked, and published. The leak turns Nixon's fear into action."
  - "The pattern of hidden machinery. Secret funds, secret property deals, and an enemies list show the methods already in place before the break-in."
skippables:
  - "The Paris hotel backstory and the wedding-day colour. They set scenes. They do not move the argument."
  - "The Key Biscayne financing detail. Useful texture, not load-bearing."
narrative: |
  <p>The Pentagon commissioned a secret history of the Vietnam war, and the basic facts of that study are <strong>confirmed</strong> against the official record. Defense Secretary Robert McNamara created the task force in June 1967, and the study ran to some 7,000 pages in 47 volumes before delivery in January 1969, days before Nixon took office (see the <a href="https://www.archives.gov/research/pentagon-papers">National Archives</a> and the <a href="https://www.nixonlibrary.gov/news/50th-anniversary-release-pentagon-papers">Nixon Library</a>).</p>
  <p>One copy sat in filing cabinets at the Rand Corporation's Washington branch. Rand analyst Daniel Ellsberg had helped compile it, and his copying of the study with Anthony Russo beginning in October 1969 is <strong>confirmed</strong> (see the <a href="https://www.cfr.org/articles/twe-remembers-pentagon-papers">Council on Foreign Relations</a>).</p>
  <p>Meanwhile in Paris, peace talks opened with a built-in tripwire. North Vietnam demanded an unconditional bombing halt first. South Vietnam had everything to lose from a quick deal. American aid and Thieu's grip on power both depended on the war continuing.</p>
  <p>By October 1968 the talks looked like they might move, and that movement threatened Nixon's election chances. His campaign already held two secret levers.</p>
  <p>The first lever was Henry Kissinger, quietly passing Paris negotiating information to Nixon. His value to the campaign is <strong>confirmed</strong> in Haldeman's notes (see <a href="https://www.politico.com/magazine/story/2017/08/06/nixon-vietnam-candidate-conspired-with-foreign-power-win-election-215461">John Farrell's account</a>).</p>
  <p>The second lever was Anna Chennault, the campaign's top female fundraiser, who knew South Vietnamese Ambassador Bui Diem and became the campaign's secret cable to Saigon. Chennault lived at the Watergate complex, an address the chapter lingers on deliberately.</p>
  <p>On the campaign's orders, Chennault urged President Thieu to stall. No bombing halt, no deal before the election, with the implied bargain of a better settlement under Nixon than under Humphrey. Thieu boycotted the talks in early November. The chapter dates the walkout to October 30, which is <strong>corrected</strong> to November 2 against the diplomatic record (see <a href="https://academic.oup.com/dh/article/48/5/633/7758644">Diplomatic History</a> and the <a href="https://history.state.gov/historicaldocuments/frus1964-68v07/d187">November 3 Johnson–Nixon call</a> describing a fresh boycott).</p>
  <p>Haldeman's notes recorded Nixon's own order to throw, in his words, a monkey wrench into the process. The wording is <strong>confirmed</strong> in the surviving notes (see <a href="https://docsteach.org/document/haldemans-notes">DocsTeach</a> and the <a href="https://www.nytimes.com/2017/01/02/us/politics/nixon-tried-to-spoil-johnsons-vietnam-peace-talks-in-68-notes-show.html">New York Times</a>):</p>
  <blockquote><p>Keep Anna Chennault working on SVN. Any other way to monkey wrench it?</p><p><em>— H. R. Haldeman's notes of Nixon's October 1968 phone order, as quoted in the chapter</em></p></blockquote>
  <p>Johnson knew. The FBI was tapping Chennault's phone and the South Vietnamese embassy, and two days before the election Johnson told Senator Everett Dirksen:</p>
  <blockquote><p>They oughtn't to be doing this. This is treason. I can identify them because I know who's doing this. I don't want to identify it. I think it would shock America if a principal candidate was playing with a source like this on a matter this important.</p><p><em>— Lyndon Johnson to Everett Dirksen, as quoted in the chapter</em></p></blockquote>
  <p>Johnson's treason charge to Dirksen, his direct confrontation of Nixon the next day, and his decision never to go public are all <strong>confirmed</strong> (see the <a href="https://www.lbjlibrary.org/media-kit/chennault-affair">LBJ Library</a> and the <a href="https://millercenter.org/the-presidency/educational-resources/turning-point-1968">Miller Center</a>). Nixon denied everything, saying Chennault had no sanction from him. Johnson never trusted Nixon, yet his advisers reasoned that accusing the president-elect of treason would open the new administration under the largest scandal in American history.</p>
  <p>The election arithmetic is <strong>confirmed</strong>: Nixon took 301 electoral votes to Humphrey's 191, with Wallace on 46, and the popular margin was 0.7 percent (see <a href="https://en.wikipedia.org/wiki/1968_United_States_presidential_election">the election record</a>, paired with <a href="https://uselectionatlas.org/RESULTS/national.php?elect=0&off=0&year=1968">Dave Leip's Atlas</a>). Whether the meddling decided the election is genuinely unclear, and Thieu may have bolted on his own. What matters is that both Nixon and Johnson believed it mattered. Nixon knew he had dodged exposure, and he stayed afraid of it surfacing.</p>
  <p>In 1970 Nixon set young staffer Tom Huston to review the bombing-halt file, and Huston's February 1970 memo to Haldeman is <strong>confirmed</strong> verbatim (see the <a href="https://www.nixonlibrary.gov/sites/default/files/virtuallibrary/documents/jan10/069.pdf">Nixon Library scan</a>):</p>
  <blockquote><p>The evidence in the case does not dispel the notion that we were somehow involved in the Chennault affair and while release of this information would be most embarrassing to President Johnson, it would not be helpful to us either.</p><p><em>— Tom Charles Huston to H. R. Haldeman, as quoted in the chapter</em></p></blockquote>
  <p>Huston also chased the paper trail to Les Gelb, now at the Brookings Institution. Historians doubt that specific report existed, so its existence stays <strong>unverified</strong>. But Nixon and Haldeman believed it did, and that belief detonated in June 1971. With the Pentagon Papers about to break, Nixon told Kissinger and Haldeman on tape to get the Brookings file, an order <strong>confirmed</strong> on the record (see <a href="https://cafe.com/article/not-one-of-american-politics-finest-hours-the-chennault-affair-and-presidential-corruption">CAFE's account</a>). Huston, the chapter quotes, swears to God there is a file on it.</p>
  <p>The wider pattern of hidden machinery was already in place. The Bay Lane houses bought after the election and the papers deduction appraised at $576,000 are <strong>confirmed</strong> money (see the <a href="https://www.nytimes.com/1974/01/13/archives/article-3-no-title-money.html">New York Times money accounting</a> and the <a href="https://www.taxnotes.com/tax-history-project/jct-investigation-nixons-tax-returns/2016/06/14/g632">Joint Committee tax inquiry</a>), while the financing roles behind the purchases are likewise <strong>confirmed</strong> (see <a href="https://time.com/archive/6841669/housing-richard-nixon-mortgagee">TIME's housing investigation</a>). The exact purchase day and the helicopter-pad spending rest on the source's account alone and stay <strong>unverified</strong>. An enemies list targeted critics from columnist Jack Anderson to quarterback Joe Namath to singer Barbra Streisand, and those names are <strong>confirmed</strong> on the expanded master list (see the <a href="https://en.wikipedia.org/wiki/Master_list_of_Nixon%27s_political_opponents">master list</a>, paired with <a href="https://www.history.com/articles/richard-nixon-enemies-list-who-was-on-it">HISTORY</a>).</p>
  <p>The chapter closes back at Rand. By late 1969 Ellsberg had turned against the war, began photocopying the study, and passed it to reporter Neil Sheehan. The chapter dates the handoff to February 1971, which is <strong>corrected</strong> to March 1971 (see the <a href="https://www.nixonlibrary.gov/news/51st-anniversary-release-pentagon-papers">Nixon Library</a>), while first publication the morning after the June 12 White House wedding is <strong>confirmed</strong> (see <a href="https://www.britannica.com/today-in-history/June-13-The-Pentagon-Papers-Reach-the-Public">Britannica</a>). Publication was the catalyst. Everything else had been brewing for years.</p>
  <p>The series apparatus itself is <strong>confirmed</strong> in the course materials, which ground the lessons in Garrett Graff's modern synthesis, Ken Hughes's tapes research on the Chennault affair, Nixon's own memoirs, and Nixon Library primaries (see the <a href="https://www.youtube.com/watch?v=GUmLe8YtIck">course video page</a>).</p>
  <p>Several threads stay open at the chapter's end, and each stays <strong>unverified</strong>: whether any Brookings file ever existed beyond Nixon's belief, who else had read the buried Chennault evidence in Johnson's tapes and the FBI wiretaps, whether the papers deduction would survive an auditor, and the full shape of what Ellsberg's copies in the newsroom would detonate. Smaller colour — the Watergate penthouse price, the Rand building's demolition year, the Paris hotel's wartime history — likewise rests on the source's account alone and stays <strong>unverified</strong>.</p>
machinery: |
  <p>The chapter builds one mechanism: a secret that must be defended creates the tools that produce the next crime.</p>
  <p>The 1968 stall is the founding secret. It cannot be admitted. So Nixon needs to know where every copy of the evidence sits. That need creates the Huston review, the Brookings obsession, and eventually the burglary teams of the following chapter.</p>
  <p>The enemies list and the property deals show the same toolkit already in hand. Surveillance, money channels, and legal grey zones predate Watergate. The break-in reuses them. It does not invent them.</p>
