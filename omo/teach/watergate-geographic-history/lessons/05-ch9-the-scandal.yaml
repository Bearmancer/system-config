lead: "The burglary becomes a scandal. A landslide re-election makes the break-in look pointless, a garage source and a newsroom turn money scraps into headlines, four investigations close in at once, a Saturday-night firing makes removal thinkable, a vice president is traded for probation, and a tapes fight Nixon loses one appeal at a time."
cast:
  - name: "Richard Nixon"
    role: "Re-elected in a 49-state landslide; orders the special prosecutor fired over the tapes subpoena; fights the tapes through edited transcripts toward the final court"
    ref: 8
  - name: "George McGovern"
    role: "1972 Democratic nominee; anti-war appeal never broadens; carries only Massachusetts and the District of Columbia"
  - name: "Bob Woodward"
    role: "Washington Post reporter; meets the garage source; with Bernstein covers the money trail to the re-election committee"
  - name: "W. Mark Felt"
    role: "FBI deputy director; the garage source called Deep Throat; identity kept secret until 2005"
  - name: "Archibald Cox"
    role: "Special prosecutor; subpoenas the tapes; fired in the Saturday Night Massacre"
  - name: "Elliot Richardson"
    role: "Attorney general; refuses the order to fire Cox and resigns"
  - name: "Spiro Agnew"
    role: "Vice president; Maryland bribery past surfaces; pleads no contest to tax evasion and resigns"
  - name: "Gerald Ford"
    role: "Michigan congressman; nominated under the 25th Amendment and confirmed that December; succession insurance while removal talk grows"
    ref: 10
essentials:
  - "The 1972 landslide voided the motive."
  - "Four fronts closed in from mid-1972 on: press, special prosecutor, courts, televised hearings."
  - "The Saturday Night Massacre inverted the stakes: from that evening removal was probably inevitable."
  - "Agnew fell first and Ford filled the gap under the 25th Amendment."
