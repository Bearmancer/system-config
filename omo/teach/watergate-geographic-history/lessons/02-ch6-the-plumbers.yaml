kicker: "Watergate: A Geographic History"
title: "The Plumbers"
chapter: 6
chapters_total: 12
time_range: "1:06:33–1:21:41"
transcript: "the-plumbers-1h06m33s-1h21m41s.md"
lead: "Rage over the Pentagon Papers leak turns into a standing covert unit. The unit misses its first target, finds its operators, and slides from leak-hunting into political warfare. The slide ends at the Watergate."
cast:
  - name: "Richard Nixon"
    role: "Orders the leak-hunting unit and the Brookings break-in; demands the file be seized"
    ref: 5
  - name: "H. R. Haldeman"
    role: "Chief of staff; relays the Brookings order and later calls Liddy unstable on the smoking-gun tape"
  - name: "John Ehrlichman"
    role: "Domestic-affairs chief; builds the Special Investigations Unit and tasks Egil Krogh"
  - name: "Henry Kissinger"
    role: "National-security adviser; lends staffer David Young to the unit"
  - name: "John Mitchell"
    role: "Attorney general turned head of the Committee to Re-elect the President; weighs Liddy's schemes"
  - name: "Egil Krogh"
    role: "Co-head of the unit with David Young; ex-drug-policy staffer, authorises the Fielding operation"
  - name: "David Young"
    role: "Co-head of the unit from Kissinger's staff; source of the Plumbers name"
  - name: "E. Howard Hunt"
    role: "Ex-CIA officer and spy novelist; co-leader, Bay of Pigs veteran, Fielding and Watergate operator"
  - name: "G. Gordon Liddy"
    role: "Ex-FBI and Treasury man on Ehrlichman's staff; unit operator under CREEP cover, Watergate tactician"
  - name: "Charles Colson"
    role: "White House counsel; pushes the Brookings fire-crew scheme, directs Hunt's Ellsberg work"
  - name: "John Dean"
    role: "White House counsel; kills the fire-engine scheme as too costly, later whistleblower"
  - name: "Daniel Ellsberg"
    role: "Pentagon Papers leaker and Fielding patient; the unit's discrediting target"
