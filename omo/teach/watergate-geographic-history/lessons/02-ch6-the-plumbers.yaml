narrative: |
  <p>The chapter opens at La Casa Pacifica in San Clemente, the estate Nixon bought in 1969. The house was built in 1926 for Hamilton Cotton, a Democratic backer who entertained Franklin Roosevelt there, and that history is <strong>confirmed</strong> against the house record (see the <a href="https://en.wikipedia.org/wiki/La_Casa_Pacifica">La Casa Pacifica history</a> with the <a href="https://www.nixonfoundation.org/2026/07/la-casa-pacifica-president-nixons-western-white-house-turns-100/">Nixon Foundation history</a>). The San Clemente and Key Biscayne purchases were financed with loans from Bebe Rebozo and Robert Abplanalp, likewise <strong>confirmed</strong> (see the <a href="https://time.com/archive/6841669/housing-richard-nixon-mortgagee/">TIME financing account</a>). The video places the unit's creation decision at San Clemente in early July 1971.</p>
  <p>The trigger is the Pentagon Papers leak. Nixon wants the leakers found, and domestic-affairs chief John Ehrlichman tasks staffer Egil Krogh, who co-leads with David Young from Kissinger's staff and ex-CIA officer Howard Hunt. They work from Room 16 of the Executive Office Building. The unit formed within a week of the Papers' publication, a timeline <strong>confirmed</strong> (see the <a href="https://www.nytimes.com/1973/07/22/archives/the-plumbers.html">NYT Plumbers account</a> with the <a href="https://www.nixonlibrary.gov/finding-aids/david-r-young-jr-white-house-special-files-staff-member-and-office-files">Nixon Library Young finding aid</a>). The Plumbers name itself came from Young's leak joke and a door sign, also <strong>confirmed</strong> (see the <a href="https://freshairarchive.org/segments/life-lessons-white-house-plumber">Krogh interview</a> with the <a href="https://en.wikipedia.org/wiki/White_House_Plumbers">White House Plumbers overview</a>).</p>
  <p>The Brookings obsession predates the unit. Nixon believes a secret report on the Chennault matter sits in a Brookings safe, and days after the Papers publish he orders Haldeman to get the file even by break-in, repeating the order through June 1971:</p>
  <blockquote><p>I want the Brookings Institution safe cleaned out.</p><p><em>— Nixon to Haldeman, Oval Office, as transcribed from the tape</em></p></blockquote>
  <p>The repeated orders are <strong>confirmed</strong> (see the <a href="https://millercenter.org/sites/default/files/2023-09/1971_0701_534_002b_brookings.pdf">Miller Center tape transcript</a> with the <a href="https://www.nytimes.com/1996/11/22/us/tapes-show-nixon-ordering-theft-of-files.html">NYT tapes report</a>). The video stresses the link: the unexecuted Brookings plan connects the Chennault paranoia to the Plumbers' later crimes.</p>
  <p>Charles Colson answers with the fire-crew plan. Plumbers dressed as firefighters start a real fire, crack the safe in the confusion, and leave on a fire engine. John Dean stops it: a secret fire engine costs too much. The scheme and Dean's cost objection are <strong>confirmed in substance</strong> (see the <a href="https://www.latimes.com/archives/la-xpm-2003-feb-18-na-tapes18-story.html">LA Times Dean account</a> with the <a href="https://crimereads.com/watergate-nixon-burglary-true-crime-white-house/">CrimeReads Liddy plan account</a>).</p>
  <p>Then the chapter introduces G. Gordon Liddy. A Hoboken childhood under airship noise. FBI and Treasury service. A post on Ehrlichman's staff. Loyalty to Nixon, hatred of his opponents, spy fantasy. Hunt, the ex-CIA man and novelist, is his partner. Liddy's 1980 memoir and its Hindenburg dread are <strong>confirmed in substance</strong> (see the <a href="https://archive.org/stream/willtheautobiographyofg.gordonliddy/Will__the%20autobiography%20of%20G.%20Gordon%20Liddy_djvu.txt">Will full text</a>), though the video compresses the 1932 Akron overhead into Hindenburg-over-Hoboken, a compression <strong>corrected</strong> against the memoir's own dating.</p>
  <p>Under CREEP cover at 1701 Pennsylvania Avenue, the mission widens from leak-hunting into covert political warfare. The headquarters address and Mitchell's campaign-director role are <strong>confirmed</strong> (see the <a href="https://oac.cdlib.org/findaid/ark:/13030/c89887nh/">OAC CREEP papers background</a>). Liddy's pitches escalate. Sex workers to compromise Democrats at the convention. Kidnapping anti-war leaders to Mexico. Both vetoed. Those vetoed schemes rest on the video's telling alone and stay <strong>unverified</strong> against located record.</p>
  <p>One scheme proceeds. Hunt proposes hitting the Beverly Hills office of Dr. Lewis Fielding, Ellsberg's psychiatrist. Steal the file, leak it, discredit Ellsberg as unstable. Hunt, Liddy, and others force the filing cabinet with a crowbar, but the file is not there. It sits at Fielding's home. The date, the method, and the miss are <strong>confirmed</strong> (see the <a href="https://www.nixonlibrary.gov/news/fielding-break-50th-anniversary">Nixon Library anniversary account</a> with the <a href="https://www.smithsonianmag.com/history/the-worlds-most-famous-filing-cabinet-36568830/">Smithsonian cabinet account</a>). The cabinet itself now sits at the Smithsonian, likewise <strong>confirmed</strong> in the same account.</p>
  <p>The crew matters. Hunt, Bernard Barker, Eugenio Martinez, and Frank Sturgis share Bay of Pigs history. Barker was Hunt's aide, and all three later burglars were invasion participants, <strong>confirmed</strong> (see the <a href="https://www.nytimes.com/1972/06/19/archives/democratic-raid-tied-to-realtor-alleged-leader-said-to-have-gop.html">NYT Barker identification</a> with the <a href="https://en.wikipedia.org/wiki/Bernard_Barker">Barker record</a>). Sturgis once fought for Castro before turning. On the June 23, 1972 smoking-gun tape Nixon tells Haldeman to stall the FBI lest the probe open up the whole Bay of Pigs thing. The quoted wording is <strong>confirmed</strong> (see the <a href="https://www.nixonlibrary.gov/sites/default/files/forresearchers/find/tapes/watergate/trial/exhibit_01.pdf">smoking-gun transcript</a>). The video reads that as fear of exposed CIA secrets rather than assassination code, but that reading stays <strong>unverified</strong> beyond the video's own judgment.</p>
  <p>The Watergate itself was the unit's fourth try at Democratic offices, after a McGovern headquarters plan proved too hard. The early tries fail in sequence. Burglars locked in a closet. A lockpicker without tools. Two bugs planted, one on the wrong line, one dead. The mid-June entry was meant to fix the bugs. That sequence is <strong>confirmed in substance</strong> (see the <a href="https://www.washingtonpost.com/wp-srv/national/longterm/watergate/articles/061872-1.htm">Washington Post arrest report</a> with the <a href="https://shepardonwatergate.com/documents/RN015.pdf">prosecution memorandum</a>).</p>
  <p>The night's tradecraft is thin. Operatives pose as salesmen at the Watergate Hotel, watching a sales film. Spotter Alfred Baldwin watches from the Howard Johnson's across the street, distracted by a monster movie on television. Liddy's tape sits crosswise on the garage-door latch, visible. Guard Frank Wills pulls it, finds it replaced, and calls police. The tape-as-decoy theory and the monster-movie program rest on the video's telling alone and stay <strong>unverified</strong>. The chapter's verdict is blunt. The Plumbers imagined themselves ace spies. They were pathetic and incompetent. That gap is the scandal's irony.</p>
  <p>Three threads never resolve inside the chapter, and each stays <strong>unverified</strong>: whether any Brookings file ever existed beyond Nixon's belief, who else had read the buried Chennault evidence, and the full shape of what the Fielding miss set in motion. The unit built to stop leaks becomes the leak that sinks the presidency.</p>
machinery: |
  <p>The mechanism is authorisation without restraint. A lawful goal, stopping leaks, gets a covert instrument with no charter limit. Each unpunished step licenses the next. Brookings talk normalises burglary. Fielding normalises execution. CREEP cover normalises election targets. Failure never stops the machine. It schedules another attempt.</p>
  <p>Map key: blue marks command, green operations, red targeting; scope is chapter-6 on-stage ties only.</p>
