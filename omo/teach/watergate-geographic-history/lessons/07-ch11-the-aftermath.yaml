transcript: "the-aftermath-2h01m19s-2h08m47s.md"
lead: "Resignation ends the presidency, not the story. The chapter follows the convicted into prison and out again, pulls back to Saigon falling, then tracks the pardon, the Frost interviews, and Nixon's long exile from San Clemente to New Jersey to the library grounds at Yorba Linda."
