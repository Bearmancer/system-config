narrative: |
  <p>The chapter opens at a federal prison camp in Montgomery, Alabama. Mitchell and Colson serve time there after convictions on various charges. Mitchell serves nineteen months, a figure <strong>confirmed</strong> against the <a href="https://www.britannica.com/biography/John-Mitchell-attorney-general-of-United-States">Mitchell biography</a>. Colson serves seven months, converts, and founds a prison ministry. The video calls this facility a representative example: Watergate defendants serve time at federal prisons across the country.</p>
  <p>The video headline figure needs correcting. It says 22 people were convicted of Watergate-related crimes. The record counts 69 charged with 48 convicted or pleading guilty, so the video figure is <strong>corrected</strong> against the <a href="https://levin-center.org/the-watergate-hearings/">convictions record</a>.</p>
  <p>The post-prison paths rhyme. Several defendants become born-again Christians inside. Many write memoirs, with Dean judged the most successful of the memoirists in the video telling, which stays <strong>unverified</strong> beyond the source. Ehrlichman writes spy novels. Hunt returns to the trade. Liddy finds a second career as a conservative talk-radio provocateur and dies in 2021, a death <strong>confirmed</strong> against the <a href="https://apnews.com/article/g-gordon-liddy-dead-d64dac896ea0c73e19079b19e171cf21">Liddy obituary</a>.</p>
  <p>The scene jumps to Ho Chi Minh City, formerly Saigon. A high-rise plaza and the park below mark the former site of the United States Embassy, torn down in 1998. The final evacuation plays out as North Vietnamese forces close in, an account <strong>confirmed</strong> against the <a href="https://millercenter.org/fall-saigon">Fall of Saigon file</a>. One famous detail needs correcting. The celebrated ladder-and-helicopter photograph was taken at the Pittman apartments building, not on the embassy grounds, a location <strong>corrected</strong> in the same file. Unification brings repression, prison camps, the boat-people exodus, and the Cambodian genocide of the late seventies.</p>
  <p>Ford, Nixon's successor, grants Nixon a full pardon for any crimes committed during Watergate, a grant <strong>confirmed</strong> against the <a href="https://www.presidency.ucsb.edu/documents/proclamation-4311-granting-pardon-richard-nixon">pardon text</a>. The video insists there is no evidence of a pre-arranged deal. Nixon hesitates to accept because acceptance legally implies guilt. He accepts anyway. Ford maintains until his death that the motive was to move the country past Watergate.</p>
  <p>Conventional wisdom blames the pardon for the 1976 loss. The video doubts it. The race between Ford and Carter runs extremely close, with Ford gaining at the end, a closeness <strong>confirmed</strong> against the <a href="https://www.presidency.ucsb.edu/statistics/elections/1976">election returns</a>. Whether the pardon caused the loss stays the video judgment against the conventional account.</p>
  <p>The Frost interviews get the longest treatment. The owner of a Dana Point-area house rents it to David Frost as the interview site, since a nearby Coast Guard station interferes with broadcast gear at the San Clemente estate. The broadcasts draw a record television audience, a record <strong>confirmed</strong> against the <a href="https://www.nixonlibrary.gov/finding-aids/frost-nixon-interview-collection-donated-materials">Frost collection file</a>. Frost presses Nixon on Watergate and on presidential power. Nixon answers with the chapter most quoted line:</p>
  <blockquote><p>"When the president does it, that means that it is not illegal."</p><cite>— Nixon to Frost, 1977 interviews</cite></blockquote>
  <p>The video calls the claim patently false, while noting Nixon may have believed it. That assessment of belief is carried as the video telling, <strong>unverified</strong> beyond the source. The interviews become a stage play, then a film directed by Ron Howard.</p>
  <p>Nixon's exile runs through real estate. Lawsuits and back taxes connected to a papers-donation deal nearly ruin him. Frost interview revenue bails him out. He writes his memoirs, sells San Clemente, passes briefly through New York, and settles in New Jersey, moves <strong>confirmed in substance</strong> against the <a href="https://millercenter.org/president/nixon/life-after-the-presidency">post-presidency file</a>. Whether his reputation recovers depends on viewpoint. The mainstream press treats him as an elder statesman. He writes foreign-policy books, advises later presidents, travels abroad, and returns to China. The Nixon Presidential Library opens in 1990.</p>
  <p>The end comes fast. Nixon suffers a stroke at home and dies days later, with burial on the library grounds steps from the house where he was born, details <strong>confirmed</strong> against the <a href="https://www.latimes.com/archives/la-xpm-1994-04-23-mn-49419-story.html">death report</a>. His wife Pat preceded him in death the previous June. The chapter closes by answering its own opening thesis. Watergate looks like a story of offices and courtrooms. The ground itself, the video argues, carries the deeper history.</p>
machinery: |
  <p>The mechanism is consequence distributed across geography. Prison scatters the guilty across federal facilities. The pardon concentrates the guilt question onto one man. Saigon shows the war outlasting the presidency that managed it. The interviews, the exile addresses, and the library plot Nixon's slow conversion from disgraced resignation into curated elder statesman, ending where he began.</p>
