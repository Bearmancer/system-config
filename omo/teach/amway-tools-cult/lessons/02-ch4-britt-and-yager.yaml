lead: "This is the founding chapter: the moment the story stops being about soap. Two Amway distributors sit in a Miami hotel coffee shop and hear a pitch to go into the tape business. Yager says no. Britt says yes. Everything the rest of the video is about flows from that fork. The chapter's quiet bombshell is why the pitch existed at all: by the mid-1960s the Amway plan was already running out of money for the people at the bottom of it."
