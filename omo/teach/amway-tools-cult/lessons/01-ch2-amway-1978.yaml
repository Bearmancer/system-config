lead: "Before the tapes, the chapter builds the machine the tapes will feed on. It walks through the classic Amway entry — a friend, butcher paper, circles — then the money flow it sells, and finishes with Wisconsin arithmetic: almost everyone in it loses money. Read closely, though: the chapter is titled \"Amway 1978\", and the year 1978 never appears in the script. What it delivers is the 1970s distributor experience plus one much-cited number — and that number, the video dates wrong."
