narrative: |
  <p><strong>1. The pitch: "showing the plan"</strong></p>
  <p>The chapter opens with a vignette, not an argument. It's the late 1970s: Vietnam over, Carter in the White House, gas short. A friend — "most likely a white middle-class man" — invites you over.</p>
  <p>He produces butcher paper and markers and draws a bunch of circles: a business where the money comes <em>not</em> from selling soap but from sponsoring people who sell soap, whose sponsors you also share in. Only at the very end does he mention the thing is Amway — and even then Amway looks minor, "just the corporation that manufactures the soap".</p>
  <p>This is <strong>"showing the plan"</strong>, slang <strong>"drawing circles"</strong> — and per the video it is the standard opening of nearly every Amway account, then and since. The chapter's point in telling it this way is structural: the pitch is local, personal, and hides the corporate name until the sale is nearly closed.</p>
  <p><strong>2. The company behind the circles</strong></p>
  <p>Amway, the chapter says, is a portmanteau of "American Way" — "used in somewhat Orwellian fashion here" — founded (in the video's telling) in 1949 and named Amway later. Its founders: two salesmen, <strong>Richard DeVos</strong> and <strong>Jay Van Andel</strong>, who had sold for <strong>Nutrilite</strong>, "generally regarded as the first multi-level marketing company".</p>
  <p>Both founders were conservative evangelical Calvinists whose worldview, per the video, "shaped the entire Amway universe".</p>
  <p>That last chain of facts is doing work for the whole video: if the founders' faith shaped the firm, then the firm's culture — and the motivational apparatus it later tolerated — is not an accident of one salesman's ambition but a continuation of something older. The chapter then parks the corporate history and points at a book: Fitzpatrick's <em>Ponzinomics</em>, "essential reading" for the MLM economy.</p>

    What the record shows — the founding dates are compressed
    <ul>
      <li><strong>1949 is not Amway.</strong> In 1949 DeVos and Van Andel formed <em>Ja-Ri Corporation</em> (their first names), which became a Nutrilite distributorship — sponsored 29 August 1949 by Jay's cousin Neal Maaskant. Amway dates from 1959: the American Way Association was incorporated in April, Amway Sales and Services Corporations followed in September, and the commonly cited founding date is 9 November 1959. Ja-Ri was merged into Amway Corporation in 1964. (Amway's own history; IBOAI corporate timeline; <a href="https://en.wikipedia.org/wiki/Amway">Wikipedia, Amway</a>.)</li>
      <li><strong>"Salesmen in Nutrilite" undersells it.</strong> They were <em>distributors</em>, not employees. They adopted multi-level selling; they did not invent it.</li>
      <li><strong>"First MLM" needs its date.</strong> Nutrilite's line runs: Rehnborg's California Vitamin Company (early 1930s) → renamed Nutrilite 1939 → the multi-level selling system arrives in <strong>1945</strong>, when Mytinger &amp; Casselberry became exclusive national distributors. Scholarship splits the credit between Rehnborg and that 1945 distributor plan; the video's shorthand is standard, but the mechanism is a 1945 invention, not a 1930s one. (<a href="https://ojs.library.carleton.ca/index.php/pcharm/article/download/1387/1248">Branchik, CHARM proceedings</a>; <a href="https://quackwatch.org/mlm/general/mlmstart/">Quackwatch</a>; <a href="https://en.wikipedia.org/wiki/Nutrilite">Wikipedia, Nutrilite</a>.)</li>
      <li><strong>"Evangelical Calvinist" is a gloss, not the term.</strong> The documented body is the <strong>Christian Reformed Church</strong> — conservative Dutch Calvinism; both men grew up in it (Grand Rapids Christian High, Calvin College). No primary source calls them fundamentalists, and "shaped the entire Amway universe" is the video's value judgment, not a documented finding. (<a href="https://www.encyclopedia.com/media/encyclopedias-almanacs-transcripts-and-maps/amway">Encyclopedia.com</a>; <a href="https://www.cambridge.org/core/journals/modern-american-history/article/compassionate-capitalism-amway-and-the-role-of-smallbusiness-conservatives-in-the-new-right/1FD61C0C8F36CC531BA004F69AC9B30F">"Compassionate Capitalism", <em>Modern American History</em></a>.)</li>
    </ul>

  <p><strong>3. The money flow — and the rub</strong></p>
  <p>The chapter then teaches the plumbing. Accept the invitation and you become a <strong>distributor</strong> — in Amway's own term an <strong>IBO</strong>, "independent business owner". (Terminology flag: "IBO" is the post-1999 term — the distributors' association took the Independent Business Owners Association International name in 1999; in this era they were Distributors, AWA/ADA members. <a href="https://www.iboai.com/our-story">IBOAI, Our Story</a>.)</p>
  <p>You have joined a <strong>line of sponsorship</strong>: your friend is your <strong>upline</strong>, you are in his <strong>downline</strong>. You buy all your product from him — for yourself, and to supply the people you recruit, who buy from you and sell on. Once a week in the 1970s you drove to your upline's house to pick up your boxes; your downline drove to yours.</p>
  <p>Then the rub, delivered as a blunt question: how many people do you know who will actually sign up to buy soap from you? Realistically you run out of people to hustle. Stay in, and "it will be just you, your AMC Pacer, and a couple of boxes of soap that you bought from your friend" — you have become your own best customer. The weekly pickup also included "some other stuff, which becomes important later": the chapter's one deliberate loose thread, left dangling.</p>
  <p><strong>4. The Wisconsin arithmetic — and what the record shows</strong></p>
  <p>The chapter's evidentiary centre is a number. In its words: in <strong>1980</strong> the Wisconsin Attorney General "crunched the numbers of the top 1% of Amway distributors in that state to see what they really made. The result was shocking."</p>
  <p>Most of that 1% posted a paper profit, but "with operating costs deducted, almost every single one of them lost money on a net basis, with the average loss penciling out to <strong>$900</strong>." Hence the chapter's conclusion: this was the best-performing sliver of the state's distributors, and even they lost — so "your odds of winning at gambling in a casino are mathematically higher than they are at making money in Amway."</p>

    What the record shows — real number, wrong year, unverifiable tail
    <ul>
      <li><strong>The study is real; the year is 1979–1980, and the action is 1982.</strong> Assistant Attorney General <strong>Bruce Craig</strong> subpoenaed the state tax returns of Wisconsin's <em>Direct Distributors</em> — roughly 200 people out of about 20,000 Wisconsin distributorships, i.e. the top ~1% — for tax years <strong>1979 and 1980</strong>. The case, <em>State of Wisconsin v. Amway Corp. et al.</em>, Dane County #589806, was filed in <strong>July 1982</strong>. "In 1980 the Attorney General crunched the numbers" collapses data period and action into one wrong date. (<a href="https://pyramidscheme.law/2023/04/27/in-memory-of-bruce-craig-a-passionate-advocate-for-victims-of-pyramid-schemes/">Douglas Brooks on Craig, with the expert affidavit</a>; <a href="https://www.cs.cmu.edu/~dst/Amway/AUS/refs.htm">Sidney Schwartz's case references</a>.)</li>
      <li><strong>The figure is $918, not $900.</strong> The expert affidavit's conclusion: average net income of Wisconsin Direct Distributors — after business expenses — was <strong>a loss of $918</strong>. Craig said it on <em>60 Minutes</em>: "After business expenses, a net income of minus $918." The same segment has the useful companion: Directs averaged "<em>gross</em> income of over $14,000" and still "wind up losing almost $1000 after business expenses". $900 is the rounded form; sources also round to $1,000.</li>
      <li><strong>"Almost every single one" is not in the record.</strong> Every sourced version states the <em>average</em> net loss. The distribution — how many of the 200 were individually in the red — is not in the affidavit excerpts, the obituary account, or the scholarship that quotes them. That phrase is the video's embellishment. Only the <em>companion</em> figure gets close: across all Wisconsin distributorships in 1979–1980 average adjusted gross income was about $267, and fewer than 1% (~139) cleared $12,000 AGI. (<a href="https://pyramidscheme.law/wp-content/uploads/2023/04/buseaff001.pdf">Craig expert affidavit (PDF)</a>.)</li>
      <li><strong>Don't credit the FTC decision.</strong> <em>In re Amway Corp.</em>, 93 F.T.C. 618 — complaint 1975, final order 8 May 1979 — is a different case, from a different forum, and it does not contain the Wisconsin numbers. It matters for the <em>next</em> stretch of the story (the "Amway safeguards": 70% rule, retail sales rule, buy-back rule), not for this figure. (<a href="https://www.ftc.gov/sites/default/files/documents/commission_decision_volumes/volume-93/ftc_volume_decision_93_january_-_june_1979pages_618-738.pdf">FTC, volume 93, pp. 618–738</a>.)</li>
    </ul>

  <p><strong>5. The casino line</strong></p>
  <p>"Your odds of winning at gambling in a casino are mathematically higher than they are at making money in Amway." It is the chapter's rhetorical flourish, and the record supports only a weaker version.</p>
  <p>The nearest thing to a source is advocacy arithmetic (Jon Taylor, 2001) comparing <em>single-bet</em> casino probabilities — craps snake-eyes 3.23%, roulette on one number 2.86% — against an <em>annual</em> MLM net-profit rate for Amway at about 0.01%. Different kinds of number: one roll of the dice against a year of a business. Treat the line as an argument, not a measurement — its job is to fix the emotional baseline before the real subject arrives.</p>
machinery: |
  <p><strong>6. What the chapter is setting up</strong></p>
  <p>The chapter ends by conceding the anti-MLM case it just made — "that analysis is fundamentally correct. Chances are virtually certain that you will lose money becoming an Amway distributor" — and then says the video isn't about that.</p>
  <p>The distributor-loss story is the visible layer; the real subject "hides behind the public face of the Amway experience": the tools. The soap was never the point; the boxes "and some other stuff" were.</p>
  <p>Watch for the shape of the argument, because the rest of the video leans on it: a system that loses money for almost everyone still had to be sold to those people every week. Whatever was sold to <em>them</em> — not to the public — is the story, and chapter 3 names it.</p>
