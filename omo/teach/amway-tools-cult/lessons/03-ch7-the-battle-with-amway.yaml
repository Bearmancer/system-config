narrative: |
  <p>The chapter opens with a 1975 montage — Saigon falls, <em>Jaws</em>, a Manson-family woman taking a shot at the president — and lands on the year's business: "the Amway Corporation begins its epic bruising battle with the Federal Trade Commission, a battle in which its survival as a company is at stake."</p>
  <p>Why now? Because the FTC was "on a roll". It had "lined up and shot down one multi-level marketing scam after another": Holiday Magic and Koscot Interplanetary — the two proto-MLMs chapter 5 profiled, and whose founders' motivational empires died with them — were gone. "And now they had their eyes on the biggest steer on the ranch, Amway, the OG MLM."</p>
  <p>What made Amway vulnerable was resemblance. Holiday Magic and Koscot had been "a little more brazen in their get-rich-quick representations" — but beyond that, the chapter says, "it was difficult for Amway to distinguish its basic pyramid-shaped business model from theirs." The differences that mattered in court were differences of degree, not kind — and everyone at Amway knew it.</p>
  <p><strong>2. The secret weapon: Gerald Ford</strong></p>
  <p>Holiday Magic and Koscot did not have a friend in the Oval Office. Amway, the chapter argues, did: "the Amway suits did have a secret weapon that Holiday and Koscot did not have, the president of the United States."</p>
  <p>The connection was geography and party. Before Gerald Ford was president he was "the long-time Republican Congressman from Grand Rapids, Michigan, right next door to Amway founder's hometown of Ada" — the founders' home territory, and the seat Ford had held for a quarter-century.</p>
  <p>Then came the accidents: Vice President Spiro Agnew resigned in a bribery scandal; under the newly passed 25th Amendment Nixon nominated Ford, and Congress approved him; then Watergate finished Nixon, and "suddenly, Grand Rapids' own congressman was in the White House."</p>
  <blockquote>
    <p>"DeVos and Van Andel wasted no time exploiting their connection to Ford. They visited him privately in the White House. The notes from that conversation, if there ever were any, have never surfaced, but we know for a fact that they were there."</p>
    <em>— chapter 7</em>
  </blockquote>
  <p>The chapter is careful here, and its care is the point. What it asserts is the visit — they were there. What it cannot produce is the conversation. So it offers two readings and refuses to pick: the White House meeting may have produced a deal — an explicit or implicit understanding about what the FTC would and would not do — "or there might not have been a deal at all. We may never know." Treat the meeting as documented; treat the deal as the video's hypothesis, built on what follows.</p>
  <p><strong>3. 1979: In re Amway</strong></p>
  <p>Then the decision people still fight about. "In 1979, after 4 years of litigation, the infamous decision in In re Amway Corporation was issued." The chapter takes a moment to make fun of what this ruling has become in the MLM world — pull out a stopwatch, it says, and see how many seconds before an MLM true believer "invokes the 1979 Amway decision as supposed proof of the legality of multi-level marketing."</p>
  <p>Then the correction, aimed at the other camp as much as the first: "I believe the Amway FTC decision, which declared that Amway is not a pyramid scheme, even though it pretty much is, is mischaracterized in anti-MLM circles." Not a whitewash. Not an acquittal. The chapter's reading:</p>
  <blockquote>
    <p>"It was not the surprise ringing endorsement of Amway that it's often made out to be. The decision was a functional victory for Amway in that it kept them alive, and it specified certain safe harbor conditions, fig leaves mostly, that if they abided by them, would theoretically keep the company from getting broken up as an illegal pyramid scheme."</p>
    <em>— chapter 7</em>
  </blockquote>
  <p>And then the sharper claim: "there's evidence that the Amway suits understood that what they had really done, all they had really done, was to fight the FTC to a draw." The line around their legal operations was thin. Cross it — run the plan the old way — and "the assault could be renewed again at any time."</p>
  <p>The company's behavior afterward supports the reading: "the Amway Corporation continued to fear and dread the FTC for years afterward. So, clearly they did not interpret the decision as a permanent absolution." Munger flags the thread explicitly: "Now, that point becomes important later on."</p>
  <p><strong>4. The invisible business: how the kingpins got rich</strong></p>
  <p>Now the chapter turns to the men the earlier lessons followed — Britt, Yager, and the rest of the tools "kingpins" — and to the machine they built in the later 1970s. Two numbers do the work: "Less than 2% of Amway distributors participate in the profits from the tools business, and 98% are never even told that major profits were being made in that business."</p>
  <p>Per the chapter's account — uncorroborated elsewhere — the men at the top kept the club closed by controlling the ladder itself. Amway pin levels — pearl, ruby, emerald, and above all diamond — run on volume, and the kingpins could move volume between themselves: "by picking and choosing who was allowed to quote-unquote go diamond. They did this through transfers among themselves of the points that conferred Amway pin levels."</p>
  <p>Transfer the points, and you could create a diamond or destroy one, with the "associated lines of business" attached to each. The effect, in the chapter's phrase, was a <strong>walled garden</strong> — a closed world whose riches only insiders could reach, because insiders decided who existed at the top at all.</p>
  <p>And at the top of the top: "Dexter Yager was the biggest of the kingpins. He had the largest volume of Amway business of anybody."</p>
  <p><strong>5. What the money looked like</strong></p>
  <p>The chapter answers "how rich?" with a portrait — Yager's 1980, "the heyday of the tools business". There was "a mansion outside Charlotte, to which Amway distributors flocked as a pilgrimage site, literally." A collection of Rolls-Royces. A collection of yachts.</p>
  <p>A coach — "a bus, basically" — to carry him to rallies "ostentatiously", including "the immense free enterprise days held at a sports arena in Charlotte." That last one is the rally this course has already watched: the one where distributors poured into the streets at 3 a.m. chanting "five and six nights a week."</p>
  <p>Then the interpretation, which is the real subject: the trappings were not just his tastes — they were the curriculum. "All these trappings of prosperity, this is all part of the false image of success posed by the tapes and rallies themselves. It was all about material wealth. Notice that the message of the tools is never reflective or transformative."</p>
  <p>Not get rich and find meaning; not get rich and seek enlightenment. "It's always, here's the coach, boat, mansion, mansion, fur coat, whatever. This is the meaning in life no deeper reflection required."</p>
  <p>The chapter ties this to a wider American religion — "exactly the vision of wealth that comes out of prosperity gospel preachers" of the era — and then flags the machinery's key move: the kingpins "were very careful to promote the impression not but not explicitly but implicitly" that the wealth came from Amway itself, from selling products and recruiting distributors, "not the tools business." The message was: work hard at Amway — "the business" — and you too will own the coach, boat, mansion and fur coats "once you go diamond." A rally favorite in the chapter's telling: "When you drive up in your brand new coach, flashing the jewelry, your wife in a new fur coat, you'll know why you worked so hard. You'll know why you're diamond."</p>
  <p><strong>6. No soap millionaires</strong></p>
  <p>Around the rallies ran a talking point so common it had become lore: "Amway produced more millionaires than any other business." The chapter's verdict is blunt — "patently and quantifiably nonsense" — but it bothers to explain why the lie was load-bearing: "it's a lie that's necessary to tell the distributors to keep them hooked."</p>
  <p>The true sentence, the one that cannot be said out loud, is the inversion: "The truth that any money that's made in Amway comes mostly from the tools cult has to be carefully hidden." Hence the rhetorical questions the kingpins needed nobody to ask: "Realistically, how many soap millionaires can there be in America? And how can there be so many people who routinely get so rich selling a product that isn't even available in retail stores?"</p>
  <p>The chapter's summary line: "there were no soap millionaires, but there were tools cult millionaires." The star exhibit, dated: "By 1990, Dexter Yager was pulling in $30 million a year, and the vast majority of it came from tools."</p>
  <p>The image kept pace — diamond rings, a Rolex, a bracelet spelling his name in diamonds — and so did the corporate machinery: Yager's "Freedom Distributing" as the financial hub of the tape operation, which "later in the '80s, became Internet Services Corporation", until his "motivational tape empire spewed its cultic rantings, many of them from Yager's own speeches at rallies, into all 50 states and 10 foreign countries."</p>
  <p><strong>7. The distraction</strong></p>
  <p>Here the two storylines fuse. The tools cult grew largest "during the time that the Amway Corporation was distracted by their long battle with the Federal Trade Commission" — and the chapter infers, citing the Postma memo it does not open, that the suits were surprised by how big and how pervasive the tools business had become, "dwarfing by many times the revenues made by selling Amway manufactured products to distributors."</p>
  <p>Or — the honest second reading — the suits knew, or suspected, and "chose to ignore the problem for as long as possible." The chapter makes that reading easy to understand: the kingpins' downlines "accounted for the lion's share of the Amway Corporation's profits"; the real nature of Yager's business was "selling tapes, books, and rally tickets"; and Amway "didn't get a piece of that."</p>
  <p>What revenue Amway did get "could exist so only so long as the tools kingpins, the diamonds, kept their downlines hooked on motivational tapes." The corporation needed the kingpins' pyramids to feed its own. It was not in a hurry to look at what the feeding was doing.</p>
  <p><strong>8. 1982: the year it breaks</strong></p>
  <p>Another montage — a recovering Ronald Reagan, <em>Thriller</em>, the Falklands — and the other kind of year: "1982 is a terrible terrible year for the Amway Corporation. Sales are slowing down. The press is increasingly abuzz with negative stories about Amway, especially its dissatisfied ex-distributors who keep talking about how weird and culty it is."</p>
  <p>One of those ex-distributors becomes a named figure: Phil Kerns, "author of <em>Fake It Till You Make It</em>, the first book-length exposé of Amway and the tools cult" — and a man with an unusually sharp piece of shared history with this story.</p>
  <p>Kerns "ironically once co-authored a book with none other than Doug Wead," about the People's Temple, "the suicide cult that resulted in over 900 deaths in Guyana in November 1978." The kingpin's ghostwriter and the system's first book-length accuser had already written a book together — about a different kind of cult, in a different country, with a different kind of ending.</p>
  <p><strong>9. Leonard Hall and the sin of crosslining</strong></p>
  <p>Bad press was noise. What "really draws the ire of the Amway suits" was money, and the man attached to it: "Sometime in late 1982, a West Coast distributor named Leonard Hall goes rogue." The chapter is upfront about how thin the record is — "I know very little about Leonard Hall, but what we do know, mostly from the Miami Showdown tape, speaks for itself."</p>
  <p>What the tape shows is ambition: Hall saw "the money being made in the tools cult and tried to make a grab for some of it." The tools were not universal across Amway's downlines; there were distributors not yet wired into the Yager system — potential customers for a rival. So Hall "went up and down the California coast poaching distributors to join his line and thus getting them hooked on tools."</p>
  <p>This is the chapter's definitional moment, the crime with a name:</p>
  <blockquote>
    <p>"This is the ultimate sin in the Amway universe. It's called crosslining. If we go back to the analogy of Amway being structured kind of like the mafia, crosslining is like gangsters from one leg of the family going into business with another separate branch. This would be viewed by the don as an act of disloyalty."</p>
    <em>— chapter 7</em>
  </blockquote>
  <p>Beyond loyalty, there is architecture: the separate lines are "insulated from each other" so that if one collapses the others survive — crosslining "would screw up the sanctity of the financial arrangements in the separate lines." Amway, "which does have some limited power to police its distributors," terminated Hall's distributorship.</p>
  <p>The video notes it found "cryptic references to something similar occurring in Hawaii about the same time" — and flags its own uncertainty: "I'm not sure about that. I couldn't nail it down."</p>
  <p>But the Hall affair had already done its damage as a signal. Smaller fish were trying "to leapfrog out of line and try to become tools kingpins themselves" — and that, the chapter says, "catches the attention of the Amway suits in Ada, Michigan."</p>
  <p>In late 1982, per the chapter's closing claim, they commission "a comprehensive internal study of the entire tools business." The chapter's closing sentence is its cliffhanger: "This is how we get the one of the most extraordinary documents in the entire history of multi-level marketing, the Postma memo." The memo is named here; its contents are the chapter's own cliffhanger.</p>
  <p><strong>11. What the record shows — checking chapter 7's claims</strong></p>

    Fact-check — verified against FTC records, presidential archives, press, and scholarship
    <ul>
      <li><strong>The FTC case is real, and the chapter's dates check out.</strong> Docket 9023: "Complaint, March 25, 1975 – Final Order, May 8, 1979" — four years and six weeks, matching the video's "1975" and "after 4 years of litigation". The citation is <em>In re Amway Corp.</em>, 93 F.T.C. 618 (1979), a Commission final order. (<a href="https://www.ftc.gov/sites/default/files/documents/commission_decision_volumes/volume-93/ftc_volume_decision_93_january_-_june_1979pages_618-738.pdf">FTC volume 93, pp. 618–738</a>; <a href="https://www.opn.ca6.uscourts.gov/opinions.pdf/03a0360p-06.pdf">Sixth Circuit, <em>Amway v. P&amp;G</em>: "following a four-year investigation and an administrative trial, the Federal Trade Commission determined that Amway was not an illegal pyramid."</a>)</li>
      <li><strong>"Not the ringing endorsement" — supported, and then some.</strong> The FTC did find Amway was not an illegal pyramid (the law judge first; the Commission affirmed), but the same order found <em>two</em> violations — resale-price maintenance and misleading earnings claims — so "functional victory… kept them alive" is fair, and the video's "mischaracterized in anti-MLM circles" lands. The "safe harbor conditions" are the order's operating rules: the 70% rule, a retail-customer qualification for bonuses, buy-back of resalable inventory, no headhunting fee, no purchase required to join; modern commentary stresses that no single rule creates a statutory safe harbor — exactly the video's "theoretically". (FTC volume 93; the rules are recited at pp. 716–17.)</li>
      <li><strong>"Killed Holiday Magic and Koscot dog dead" — right outcome, looser history.</strong> FTC actions confirmed: Holiday Magic — Docket 8834, complaint 18 Jan 1971, decision 15 Oct 1974 (84 F.T.C. 748), ordered to cease its "open-ended, multilevel marketing plan" — but chapter 5's own account puts founder William Penn Patrick's 1973 death, plus state and SEC suits, inside that company's end, so the FTC did not kill it alone; Koscot — Docket 8888, complaint 24 May 1972, final order Nov 1975 (86 F.T.C. 1106). Glenn W. Turner's criminal end is later than chapter 5 implies: a single securities misdemeanor and probation in 1975; prison only after 1987 convictions. (<a href="https://www.ftc.gov/system/files/ftc_gov/pdf/In-the-Matter-of-Holiday-Magic-Inc-et-al-84-FTC-748.pdf">FTC, 84 F.T.C. 748</a>; <a href="https://www.ftc.gov/sites/default/files/documents/commission_decision_volumes/volume-86/ftc_volume_decision_86_july_-_december_1975pages_1106-1202.pdf">86 F.T.C. 1106</a>; <a href="https://www.orlandosentinel.com/1987/08/17/glenn-turner-out-of-luck-fraud-sentencing-may-be-his-day-of-reckoning">Orlando Sentinel, Aug 1987</a>.)</li>
      <li><strong>The Ford tie is documented; the 1975 private visit is not — and the deal never was.</strong> The relationship is real and old: Ford held Grand Rapids, next door to Ada; he was a fixture at Amway events ("a favorite at the company's conventions in the 1970s and 1980s", and a speaker at its national conventions); Politico's DeVos obituary records DeVos visiting Ford in the Oval Office, where the president asked him to deliver one of his motivational speeches "for an audience of one"; MLive records Ford cutting ribbons at early Amway product launches. But no Ford Library diary or archive entry for a private 1975 DeVos–Van Andel meeting surfaced in this pass — so "we know for a fact they were there" remains the video's assertion, and the deal stays where the video leaves it: "we may never know". (<a href="https://www.politico.com/magazine/story/2018/12/30/rich-richard-devos-obituary-amway-politics-2018-223306">Politico, 2018</a>; <a href="https://www.spokesman.com/stories/1996/oct/13/chasing-the-dream-amway-gives-republicans-a/">Spokesman-Review, 1996</a>; <a href="https://www.mlive.com/business/west-michigan/2016/01/devos_family_donations.html">MLive, 2016</a>.)</li>
      <li><strong>The Manson–Carnegie pipeline is real; the Fromme attribution is not.</strong> The attempt (Sacramento, 5 Sept 1975) is confirmed. Jeff Guinn's biography documents Manson building his recruitment pitch by cribbing lines "word for word" from Chapter 7 of Dale Carnegie's <em>How To Win Friends and Influence People</em> — so Carnegie technique is genuinely in the family's recruitment story. But no source traces Fromme's own recruitment to Carnegie technique: the montage's causal clause is the video's flourish, not the record's. (<a href="https://www.npr.org/transcripts/223463616">Guinn, NPR <em>Fresh Air</em></a>; <a href="https://ford.blogs.archives.gov/2023/09/05/squeaky">Ford Library blog</a>.)</li>
      <li><strong>Yager's scale — confirmed.</strong> The Charlotte Observer's 1995 series: "Yager's network of 1 million distributors — Amway's largest"; "From Charlotte he sits atop half of Amway's global sales network of 2 million people", his distributors selling "$2 billion worth" the previous year. (Observer text via an archive mirror; the paper's own archive is paywalled — treat the host as advocacy-adjacent.)</li>
      <li><strong>"$30 million a year by 1990" — not found, and the figures actually on the record are smaller.</strong> Forbes (1985): Yager guessed his non-Amway tape-book-rally business was "roughly $1.5 million" — about two-thirds of his annual income. The Observer (1995): Forbes "put it at more than $10 million a year in 1991", with Internet Services "now a $35 million a year business" — company revenue, not personal income. The video's footnote for the $30M figure points at an unrelated thesis on Jim Bakker; the number itself could not be traced. (<a href="https://www.cs.cmu.edu/~dst/Amway/AUS/tools.htm">critic archive hosting the Forbes and Free Press texts</a>; Observer series above.)</li>
      <li><strong>The lifestyle portrait — substantially confirmed, details adjusted.</strong> The residence: a 15,000-square-foot, $1.6 million log house on Lake Wylie, on the NC/SC line, "outside Charlotte". The garage: three Rolls-Royces and four Mercedes (video: "a collection of Rolls-Royces"). The water and air: four boats and a seven-seat Hawker jet (video: "collection of yachts"). The road: a $350,000 motor home named the "Freedom Special" (video: "a coach, a bus"). Free Enterprise Day rallies confirmed (Atlanta and Salt Lake crowds of 80,000 or more, plus a Charlotte Coliseum meeting); the chant is on the record from 1982: "Five to six / Nights a week." (Observer series; <sup><a href="https://www.cs.cmu.edu/~dst/Amway/AUS/tools.htm">11</a></sup>.)</li>
      <li><strong>Freedom Distributing → Internet Services — confirmed, one date corrected.</strong> "In 1980, he and his family formed a corporation called Freedom Distributing. It became Internet Services Corp. in 1989" (the video's "later in the '80s"); the Fifth Circuit's <em>P&amp;G v. Amway</em> adds the structure — Yager's sons "formed Internet and purchased the assets of Freedom Distributing". Scale confirmed: tapes "shipped to 50 states and 10 foreign countries". (Observer series; <a href="https://www.courtlistener.com/opinion/26434/procter-gamble-co-v-amway-corporation-e/">Fifth Circuit, 2002</a>.)</li>
      <li><strong>The 2% / 98% split — the video's figure, not the record's.</strong> No contemporaneous press, court filing, or internal memo found using that wording; the video's own footnote points at an ex-distributor's video, not the internal study the chapter describes. Read it as "the video's account", pending the document the chapter names but does not open. (Unfindable in this pass; logged in <a href="../RESOURCES.md">Resources</a> gaps.)</li>
      <li><strong>Phil Kerns — confirmed, dated 1982, "first" qualified.</strong> A former distributor; <em>Fake It 'Til You Make It</em> was published by Victory Press in 1982 (the video does not date it). "The first book-length exposé" is a distributor-critic's assessment rather than an established fact — though Forbes credited the book with "creating a great deal of negative publicity". The Wead co-authorship is exactly as described: <em>Peoples Temple, Peoples Tomb</em>, Logos International, 1979. Jonestown: 909 dead, 914 counting the Georgetown victims — the video's "over 900" is right. (<a href="https://openlibrary.org/authors/OL1866506A/Phil_Kerns">Open Library</a>; <a href="https://jonestown.sdsu.edu/?page_id=31910">SDSU Jonestown archive</a>; <a href="https://www.nytimes.com/1978/11/27/archives/toll-at-jonestown-is-set-at-909-by-us-as-army-pulls-out-last-183.html">NYT, Nov 1978</a>.)</li>
      <li><strong>1982 — a legal and press year, not, on the record, a sales collapse.</strong> Wisconsin's attorney-general suit (case 589806, 1982) examined distributor earnings; critical coverage ran (NYT, "U.S. Disputes Amway Claims", Aug 1982; Mother Jones, 1981; Maclean's, 1983); and internal Amway policy memos from August and December 1982 called the distributor "systems" a "threat to the future security of Amway Corporation" and warned they were "Drawing legal and media heat (capitalisation normalised; original in all caps)." Amway's own chronicle dates the $1 billion sales year to 1980 — so "sales are slowing down" is the chapter's claim, not a documented 1982 number. (Internal memos and clippings via critic archive — label advocacy; <a href="https://www.nytimes.com/1982/08/26/business/us-disputes-amway-claims.html">NYT, Aug 1982</a>.)</li>
      <li><strong>Leonard Hall — unfindable, as the video itself admits.</strong> No press or court trace of the California crosslining or of the termination surfaced; the only entry located is a distributor-maintained wiki saying the Halls "qualified Crown in 1979" and "sold their business in 1986", which sits awkwardly with a late-1982 termination. The Hawaii parallel: the video says "I couldn't nail it down." Both remain the video's account. (<a href="https://amwaywiki.com/Hall,_Leonard_%26_Paula">AmwayWiki</a> — distributor-run, never a sole source.)</li>
      <li><strong>"More millionaires than any other business" — a documented talking point, and false as stated.</strong> The line is on the record from recruiting contexts — "You're told that this business has created more millionaires than any other business except for Microsoft" (Orlando Weekly, 2007) — and in anti-MLM rebuttals. The chapter's own verdict, "patently and quantifiably nonsense", is the conclusion the record supports. (<a href="https://www.orlandoweekly.com/news/look-whos-knocking-2257550/">Orlando Weekly</a>.)</li>
    </ul>
machinery: |
  <p><strong>10. What the chapter establishes mechanically</strong></p>
  <ul>
    <li><strong>Two front lines become one story.</strong> The FTC battle (external survival) and the tools cult (internal rot) run on the same years and the same money; the chapter's structure says the corporation's distraction is precisely the tools' opportunity.</li>
    <li><strong>The political weapon.</strong> Amway's structural difference from the dead proto-MLMs is not its plan — it is a personal channel to the presidency at the exact moment the FTC came calling (the video's account; the meeting is asserted, the deal is hypothetical).</li>
    <li><strong>The decision, demystified.</strong> 1979 is neither absolution nor defeat: a functional victory, safe-harbor conditions, and a corporation that stays afraid — a fear the chapter plants as a fuse.</li>
    <li><strong>The economics of the walled garden.</strong> Per the chapter's account — uncorroborated elsewhere — point transfers let kingpins decide who goes diamond; tools profits reach less than 2% of distributors; the 98% are kept uninformed because the wealth story must point at Amway products, not tools.</li>
    <li><strong>Dependence.</strong> Amway takes no cut of tape revenue but needs the tape-fed downlines for its own profit — the reason it can't look too hard at the tools business, stated as the chapter's central irony.</li>
    <li><strong>The trigger.</strong> Crosslining by a small fish exposes that the kingpins' system could be replicated by anyone — and produces, per the chapter's closing claim, the internal study whose document (the Postma memo) closes the chapter and opens the next.</li>
    <li><strong>Method lesson.</strong> The chapter distinguishes rigorously between what it can document (the visit, the decision, the numbers) and what it can only hypothesize (the deal, the Hawaii case, Hall's motives) — the same discipline the viewer is being taught to apply to the kingpins' own claims.</li>
  </ul>
