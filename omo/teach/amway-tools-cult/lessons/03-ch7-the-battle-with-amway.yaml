lead: "This is the pivot chapter: the Amway corporation fighting for its corporate life against the Federal Trade Commission, and the tape \"kingpins\" growing rich off the distributors Amway depends on. The chapter's argument is that the two fights are one story. Amway survives the FTC — but as a diminished version of itself, quietly dependent on men whose real business, the tools, it does not own and cannot control. While the corporation's attention is elsewhere, the tools business becomes the actual money in Amway. The chapter closes on the document that finally forced the company to confront the thing growing inside it: the Postma memo."
