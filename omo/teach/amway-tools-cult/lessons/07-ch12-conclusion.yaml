narrative: |
  <p>The tools business goes on, its legality still untested. The wider MLM economy keeps multiplying while official action never comes. And this story, the video says, sits "at the heart of the history of American business, economics, and politics in the past 60 years," with Dexter Yager astonishingly unrecognised as one of recent American history's most important and influential people. The chapter's argument is that the people are dead and the machine outlived them. If you are lost in this chapter, hold three things: who died and when, which present-day claims the record now revises, and which verdicts are the video-maker's own.</p>
  <p><strong>2. The roll-call, in the video's order</strong></p>
  <p>Every line below is the video's wording first; corrections sit beside it in the fact-check box further down, never inside the quote.</p>
  <blockquote>
    <p>"Most of the major participants in our story are gone now. Bill Britt, first to mass produce tools cult tapes, died in Ponte Vedra Beach, Florida in January 2013. In the latter part of his career, he concentrated heavily on building Amway downlines and spreading the tools cult to India."</p>
    <em>— the video, on Britt (obituary confirms the Crown Ambassador work in the US and India)</em>
  </blockquote>
  <p>Then the falling-out, given exactly the weight the video gives it — one hedged sentence, with the research gap stated openly:</p>
  <blockquote>
    <p>"He seems to have had a falling out with Dexter Yeager at some point, but I didn't spend much time researching that."</p>
    <em>— the video, on the Britt–Yager split (captions show "Yeager"; canonical: Yager)</em>
  </blockquote>
  <p>The record's gloss, kept out of the quote: a distributor-secondary summary says Britt "split from Yager and founded Britt World Wide… later reconciled" — the video's account, unverified beyond that.</p>
  <blockquote>
    <p>"Doug Wead, who documented the birth of the tools cult and certainly profited from it, passed away in December 2021. Jay Van Andel, co-founder of Amway Corporation, died in December 2004. His partner, Rich DeVos, passed away in September 2018."</p>
    <em>— the video, on Wead, Van Andel and DeVos (all three dates confirmed)</em>
  </blockquote>
  <blockquote>
    <p>"The master kingpin himself, Dexter Yeager, died peacefully at his home in Charlotte, North Carolina on January 6th, 2019."</p>
    <em>— the video, on Yager (date confirmed; "peacefully at his home" appears in no obituary — flagged)</em>
  </blockquote>
  <p>And the afterlife of the kingpin's reputation, quoted because it sets up the machinery of the chapter — the movement outlives its founder:</p>
  <blockquote>
    <p>"There are numerous tributes to him on the web, many from obvious acolytes of the tools cult, who still speak of him effusively and parrot the bromides that he spent decades delivering."</p>
    <em>— the video, on Yager's posthumous following</em>
  </blockquote>
  <p><strong>3. The two claims about the present</strong></p>
  <p>The chapter pivots from the dead to the living system with two sentences that the record now revises — quoted here as the video spoke them, corrected in the fact-check box:</p>
  <blockquote>
    <p>"The tools cult continues on to this day. It remains a major focus of the criticism directed at the Amway phenomenon as a whole, particularly from the anti-MLM movement. The legality of the tools business remains officially untested by the FTC or federal courts."</p>
    <em>— the video, on the tools business today (superseded — see the fact-check box)</em>
  </blockquote>
  <blockquote>
    <p>"The advance of the broader political and social project of the Amway universe and the increasing share of the American economy that's tied up in ever-multiplying MLM grifts leaves me skeptical that there will ever be any meaningful act official action to disrupt these organizations."</p>
    <em>— the video, on official inaction ("act official action" is the captions' garble; the sense is "meaningful official action")</em>
  </blockquote>
  <p>Read the pair together: the first says no court has ever ruled on the tools business; the second says none ever will, because the grifts keep multiplying into a larger share of the economy. Both halves have since met the record — the first overtaken by the September 2026 filing, the second running against the sales trend.</p>
  <p><strong>4. The historian's claim and the Yager verdict</strong></p>
  <blockquote>
    <p>"Historically, in my opinion, there needs to be a lot more attention paid to this story, which I believe lies at the heart of the history of American business, economics, and politics in the past 60 years."</p>
    <em>— the video, on why the story matters</em>
  </blockquote>
  <blockquote>
    <p>"In my view, the fact that Dexter Yeager, love him or hate him, is not recognized as one of the most important and influential people in recent American history is astonishing."</p>
    <em>— the video, the Yager verdict (his assessment — present it as such)</em>
  </blockquote>
  <p>The "first attempted by a historian" claim belongs here too: the video presents this telling as, to its maker's knowledge, the first historical treatment of the tools business. No book-length scholarly history of the tools/BSM business was found after multi-round searching — dissertations and articles touch it (Harris, Harvard 1992; <a href="https://surface.syr.edu/etd/1090">Mondom, Syracuse 2019</a> on "tools" in Amway's corporate philosophy; Burch 2015; Biggart 1989), while earlier books cover Amway generally (Butterfield 1985; Carter 1999; Scheibeler; FitzPatrick). So the claim stands qualified-confirmed, with the video's own qualifier ("to my knowledge") doing the load-bearing work.</p>
  <blockquote>
    <p>"But, if you've gone this far into the video, you now know more about him than most people do."</p>
    <em>— the video, to the viewer who stayed</em>
  </blockquote>
  <p><strong>6. What the record shows — checking chapter 12 claims</strong></p>

    Fact-check — verified against obituaries, dockets, the DSA/DSEF 2025 report, WFDSA figures, and the scholarship search
    <ul>
      <li><strong>Bill Britt — confirmed.</strong> Died 23 January 2013 in Ponte Vedra Beach, Florida (<a href="https://www.legacy.com/us/obituaries/newsobserver/name/billy-britt-obituary?id=12439515">News &amp; Observer obituary</a>). The obituary also confirms his Crown Ambassador work in the US and India, matching the video's late-career India line.</li>
      <li><strong>Doug Wead — confirmed.</strong> Died 10 December 2021, age 75, after a stroke/heart failure.</li>
      <li><strong>Jay Van Andel — confirmed.</strong> Died 7 December 2004, at home in Ada, Michigan (Parkinson's).</li>
      <li><strong>Rich DeVos — confirmed.</strong> Died 6 September 2018, at home in Ada, age 92.</li>
      <li><strong>Dexter Yager — confirmed with a flag.</strong> Died 6 January 2019, age 79 (family obituary; Charlotte Observer: "died Jan. 6"). The video's "peacefully at his home" — no obituary states place or manner, so the manner-and-place is the video's wording alone.</li>
      <li><strong>The Britt–Yager falling-out — the video's account.</strong> Only a distributor-secondary summary exists ("split from Yager and founded Britt World Wide… later reconciled"), and the video itself says it did not research the split. Keep the sentence with its hedge attached.</li>
      <li><strong>CORRECTION — "untested" is superseded.</strong> On 17 September 2026 the FTC and Washington State filed against Amway, World Wide Group and Leadership Team Development: a proposed $225m settlement, W.D. Wash. case 2&#58;26-cv-03474 — the first FTC action directed at the Approved Provider/BSM training system (<a href="https://www.ftc.gov/news-events/news/press-releases/2026/09/ftc-takes-historic-action-against-multilevel-marketing-operator-amway-unfair-deceptive-business">FTC release</a>; complaint: Amway itself expressed concerns about IBO training spending "since at least the early 1980s"). State it exactly so: filed and proposed, allegations, no final judgment — and it postdates the video. The 2006 Professional Development Accreditation Program and 2010 Accreditation Plus were corporate programs, not legal rulings.</li>
      <li><strong>CORRECTION — the industry-size line runs against the figures.</strong> The "ever-multiplying MLM grifts" and "increasing share of the economy" phrasing is the video's characterisation. The record's scale: US direct selling $34.7bn retail sales in 2024 with 5.4m sellers (about $6,426 in retail sales each) per the <a href="https://www.dsa.org/docs/default-source/industry-fact-sheets/dsef-2024-g-o-factsheet.pdf">DSA/DSEF 2025 report</a>; WFDSA 2024 global retail sales $163.9bn — with US sales contracting about −6.6% a year over 2021–2024. Use the figures as scale and note the trend runs the other way.</li>
      <li><strong>"First attempted by a historian" — qualified-confirmed.</strong> No book-length scholarly history of the tools/BSM business was found after multi-round searching; dissertations and articles touch it (Harris, Harvard 1992; <sup><a href="https://surface.syr.edu/etd/1090">1</a></sup>; Burch 2015; Biggart 1989), and earlier books cover Amway generally (Butterfield 1985; Carter 1999; Scheibeler; FitzPatrick). Keep the video's own qualifier ("to my knowledge").</li>
      <li><strong>The Yager-importance verdict — the video's assessment.</strong> Yager "not recognised as one of the most important… people in recent American history" is Munger's verdict; the lesson presents it as his, not as the record's.</li>
      <li><strong>Names spelled right.</strong> Captions render "Yeager"; canonical throughout this course: Yager.</li>
    </ul>
machinery: |
  <p><strong>1. What matters — and what you can skip</strong></p>
  <p><strong>Keep these four essentials:</strong></p>
  <ol>
    <li><strong>The roll-call.</strong> Five deaths, in the video's order: Bill Britt (January 2013, Ponte Vedra Beach, Florida), Doug Wead (December 2021), Jay Van Andel (December 2004), Rich DeVos (September 2018), Dexter Yager (6 January 2019, Charlotte, North Carolina). Every date confirmed in the record; the "peacefully at his home" manner-and-place for Yager is the video's wording alone — no obituary states it.</li>
    <li><strong>The superseded sentence.</strong> "The legality of the tools business remains officially untested by the FTC or federal courts" was the video's position — and it has since been overtaken: on 17 September 2026 the FTC and Washington State filed against Amway, World Wide Group and Leadership Team Development, with a proposed $225m settlement (W.D. Wash. case 2&#58;26-cv-03474), the first FTC action directed at the Approved Provider/BSM training system. Filed and proposed, allegations only, no final judgment — and it postdates the video.</li>
    <li><strong>The industry-size correction.</strong> The "ever-multiplying MLM grifts" and "increasing share of the American economy" lines are the video's characterisation. The record's scale figures run the other way: US direct selling did $34.7bn in retail sales in 2024 across 5.4m sellers (about $6,426 each) per the DSA/DSEF 2025 report, with US sales contracting around −6.6% a year from 2021 to 2024; global retail sales were $163.9bn in 2024 (WFDSA).</li>
    <li><strong>The two verdicts that stay the video's.</strong> "First attempted by a historian" keeps its qualifier ("to my knowledge") — no book-length scholarly history of the tools/BSM business surfaced after multi-round searching, though dissertations and articles touch it. And Yager as one of the most important and influential people in recent American history is Munger's assessment, presented as his.</li>
  </ol>
  <p><strong>What can be skimmed:</strong> the promo coda (companion piece, deep-dive section, Indiana Jones / Gladiator / Titanic / JFK videos, the crime thriller <em>The Sun Thief</em>, Patreon and Ko-fi links, shaunmunger.com courses, the subscribe ask) is sign-off, not argument — note the companion piece exists and move on. The Britt–Yager falling-out gets one sentence because the video gives it one sentence and says it did not research it.</p>

    Cast — on stage this chapter
    <ul><li><strong>Name</strong> — Role this chapter</li><li><strong>Bill Britt</strong> — Remembered as first to mass-produce the tapes, late career in India — full line in Lesson 02 (chapter 4)</li><li><strong>Dexter Yager</strong> — "The master kingpin himself," eulogised and indicted in the same breath — full line in Lesson 02 (chapter 4)</li><li><strong>Doug Wead</strong> — Remembered as the man who documented the birth and profited from it (chapter 4, Lesson 02)</li><li><strong>Jay Van Andel</strong> — The co-founder's death notice — full line in Lesson 01 (chapter 2)</li><li><strong>Rich DeVos</strong> — The partner's death notice — full line in Lesson 01 (chapter 2)</li><li><strong>Shaun Munger</strong> — The video's maker and narrator; delivers the obituaries, the three closing claims, and the promo coda</li></ul>

  <p><strong>5. The machinery: what the chapter establishes structurally</strong></p>
  <ul>
    <li><strong>The obituary as verdict.</strong> Five death notices do the work of a closing argument: the participant era is over — Britt, Wead, the two founders, the master kingpin himself — and naming them in order lets the video declare the story complete while the system it describes continues. The people die; the machine outlives them.</li>
    <li><strong>The "untested" sentence as era-marker.</strong> The legality claim was true to the video's knowledge at recording and now reads as a timestamp: the September 2026 FTC–Washington filing is the first FTC action directed at the Approved Provider/BSM training system, with a complaint alleging Amway itself worried about IBO training spending "since at least the early 1980s." The chapter's hinge sentence became history.</li>
    <li><strong>The asymmetry of the two present-day claims.</strong> The tools-cult-continuation half survives (the anti-MLM movement still centres it); the ever-multiplying-economy half does not match the figures (US sales contracting ~6.6% a year, 2021–2024). One claim aged well, the other did not — the lesson keeps them separate for that reason.</li>
    <li><strong>The historian's bid and the Yager bid.</strong> Two self-placement moves close the argument: the telling as the first historical treatment (qualified, kept with its qualifier), and Yager as an unrecognised giant of recent American history (the video's verdict, not the record's). Both are assessments — the lesson presents them labelled.</li>
    <li><strong>The coda as genre signal.</strong> Companion piece, deep-dive shelf (Indiana Jones and the Last Crusade, Gladiator versus Fall of the Roman Empire, the Titanic essay, the two-part JFK series), the thriller <em>The Sun Thief</em>, Patreon and Ko-fi, the history courses at shaunmunger.com, the subscribe ask — the chapter ends as a working video-maker's sign-off, which is also where the course's primary source lives.</li>
  </ul>
  <ul>
    <li><strong>The companion piece.</strong> "There is a much shorter companion piece to this video in which I briefly explain how I made it, where I think this story fits in the broader anti-MLM sphere, and some tidbits that didn't make the final cut" — the video's own pointer, quoted as its words. Its contents sit outside this chapter.</li>
    <li><strong>Will official action ever come?</strong> The chapter's skepticism is now a dated prediction with a live test beside it: the September 2026 filing is proposed, not final. Whether it disrupts anything is the open point the chapter leaves behind.</li>
    <li><strong>What really split Britt and Yager?</strong> "He seems to have had a falling out… but I didn't spend much time researching that." The reconciliation is asserted by a distributor secondary only. Left open deliberately.</li>
    <li><strong>The anti-MLM movement's half of the story.</strong> The video notes the tools cult "remains a major focus of the criticism… particularly from the anti-MLM movement" without adjudicating that criticism. That adjudication is not this chapter's work.</li>
  </ul>
